// кукла / схема из фигур (элемент shapes): прямоугольники с фаской и «зерном», повязка, шина, капля крови, «!»,
// выбранная — золотая рамка, цель — пунктир; нажатие на фигуру — action(id)
// график плагина: линии по точкам (null — разрыв), сетка в три ряда, подписи оси Y (si — 1.2k / 3.4M), подписи под осью,

  const n = a >= 100 ? Math.round(v) : a >= 10 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100;
  return n + (p || unit ? ' ' : '') + p + (unit || '');
}
function pChart(w){

  if (w.max == null){ const m = Math.pow(10, Math.floor(Math.log10(Math.max(hi - lo, 1e-9)))); hi = Math.ceil(hi / m * 1.08) * m; }
  if (hi <= lo) hi = lo + 1;
  const y = v => (H - (v - lo) / (hi - lo) * H).toFixed(1);
  const lines = S_.map(s => {
    const n = s.values.length, x = i => (n < 2 ? W : i / (n - 1) * W).toFixed(1), col = s.color || 'var(--p-acc,var(--blue))';
    const segs = []; let cur = [];
    s.values.forEach((v, i) => { if (v == null){ if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(v)]); });
    if (cur.length) segs.push(cur);
    return segs.map(g => (s.fill && g.length > 1 ? `<polygon points="${g[0][0]},${H} ${g.map(p => p.join(',')).join(' ')} ${g[g.length - 1][0]},${H}" fill="${col}" fill-opacity=".14" stroke="none"/>` : '')
      + `<polyline points="${g.map(p => p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join('');
  }).join('');
  const grid = [0, .5, 1].map(t => `<line x1="0" x2="${W}" y1="${(t * H).toFixed(1)}" y2="${(t * H).toFixed(1)}" stroke="currentColor" stroke-opacity=".12" vector-effect="non-scaling-stroke"/>`).join('');
  const ylab = [1, .5, 0].map(t => `<span class="pcy" style="top:${(1 - t) * 100}%">${esc(pSi(lo + (hi - lo) * t, w.unit, w.si))}</span>`).join('');
  const last = s => { for (let i = s.values.length - 1; i >= 0; i--) if (s.values[i] != null) return s.values[i]; return null; };
  return `<div class="pchart">${w.label ? `<div class="pcth"><span>${esc(w.label)}</span>${w.sub ? `<span>${esc(w.sub)}</span>` : ''}</div>` : ''}
    <div class="pcbox" style="height:${Math.round(w.h || 160)}px">${ylab}<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(w.label || '')}">${grid}${lines}</svg></div>
    ${w.xs && w.xs.length ? `<div class="pcx">${w.xs.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
    ${S_.some(s => s.label) ? `<div class="pclg">${S_.map(s => `<span><i style="background:${s.color || 'var(--p-acc,var(--blue))'}"></i>${esc(s.label || '')}<b>${esc(pSi(last(s), w.unit, w.si))}</b></span>`).join('')}</div>` : ''}</div>`;
}
function pShapesDefs(){

const keepBody = fn => { const b = document.querySelector('#overlay .dlg-b'), y = b ? b.scrollTop : 0; fn(); const n = document.querySelector('#overlay .dlg-b'); if (n) n.scrollTop = y; };
function bellDock(){

function markRead(){
  const top = S.events.reduce((m, e) => Math.max(m, e.id), 0);

}
const LV_COL = {info:'var(--mu)', warn:'#FFB547', error:'var(--red)', update:'var(--acc)'};

// ---------- диагностика ПК ----------
const fmtB = b => { if (b == null) return '—'; const u = [T('B', 'Б'), T('KB', 'КБ'), T('MB', 'МБ'), T('GB', 'ГБ'), T('TB', 'ТБ')]; let i = 0; while (b >= 1024 && i < 4){ b /= 1024; i++; }
  return `${DEC(b >= 100 || i === 0 ? Math.round(b) : b.toFixed(1))} ${u[i]}`; };
const pctCol = v => v > 90 ? 'var(--red)' : v > 75 ? '#FFB547' : 'var(--green)';
// вкладка «Дек»: сам дек — сколько работает, процесс и потоки, плагины (остановить / перезапустить), сообщения,
// подключения, ошибки; «Отчёт» — zip для разработчика в logs/reports на ПК (и скачать на телефон)
const fmtUp = s => { s = Math.max(0, s | 0); const d = s / 86400 | 0, h = s % 86400 / 3600 | 0, m = s % 3600 / 60 | 0;
  return d ? `${d} ${T('d', 'д')} ${h} ${T('h', 'год')}` : h ? `${h} ${T('h', 'год')} ${m} ${T('min', 'хв')}` : `${m} ${T('min', 'хв')} ${s % 60} ${T('s', 'с')}`; };
const hhmm = ts => { const d = new Date(ts * 1000), z = n => String(n).padStart(2, '0'); return `${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
function healthHtml(){

    : x.running ? ['var(--green)', T('running', 'працює')] : ['var(--mu)', T('off', 'вимкнено')];

  </div>`;
}

// ---------- общий буфер обмена ПК ↔ телефон ----------

const urlOf = t => (String(t).match(/https?:\/\/\S+/) || [''])[0];
function phoneCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';

  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();

}

// ---------- визуализатор в шапке: спектр того, что играет на ПК, цветами обложки трека ----------
// ПК шлёт ~30 кадров в секунду, пока шапку видно ({"t":"viz","on":…}); кадр — буква на полосу, 64 уровня.
// Полосы — от центра к краям (басы в середине), вверх и вниз от средней линии; подъём быстрый, спад плавный.
const VZ_ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const VZ_N = 48;
const VZ = {lv:new Float32Array(VZ_N), cur:new Float32Array(VZ_N), at:-1e9, t:0, raf:0, sent:null,
  pal:[[77,163,255],[167,139,250],[46,196,182]], from:null, to:null, t0:0, art:null, grad:null, gkey:''};
const vizHtml = () => S.cfg.viz !== false && !S.edit ? '<canvas class="viz" aria-hidden="true"></canvas>' : '';
const vizCanvas = () => document.querySelector(S.saver ? '#saver canvas.viz' : '#view canvas.viz');
function vizIn(b){
  for (let i = 0; i < VZ_N; i++){ const k = VZ_ABC.indexOf(b[i]); VZ.lv[i] = k > 0 ? k / 63 : 0; }
  VZ.at = performance.now();
  vizKick();
}
// просить спектр, только когда шапку видно: экран включён, не правка, не микшер, не окно поверх, не саундпад
function vizSync(){
  vizArt();                               // без обложки цвета — от плеера и режима: режим сменили — подстроиться
  const win = S.settings || S.picker || S.group != null || S.hk || S.sc || S.ctx || S.center || S.diag || S.clipWin || S.devWin || S.wl || S.modeEdit || S.padCfg;
  const on = !!(S.conn && S.cfg.viz !== false && !document.hidden && !S.screenOff && vizCanvas() && (S.saver || (!S.mixer && !S.pad && !win)));
  if (on !== VZ.sent){ VZ.sent = on; send({t:'viz', on}); }
  if (on) vizKick();
}
function vizKick(){ if (!VZ.raf) VZ.raf = requestAnimationFrame(vizFrame); }
function vizFrame(t){
  VZ.raf = 0;
  const c = vizCanvas();
  if (!c) return;
  const dt = Math.min(4, Math.max(0.25, (t - (VZ.t || t - 16.7)) / 16.7)); VZ.t = t;   // в кадрах по 60 Гц
  const stale = t - VZ.at > 400;          // кадры с ПК перестали идти — тишина
  const up = 1 - Math.pow(0.45, dt), down = 1 - Math.pow(0.86, dt);
  let moving = false;
  for (let i = 0; i < VZ_N; i++){
    const d = (stale ? 0 : VZ.lv[i]) - VZ.cur[i];
    VZ.cur[i] += d * (d > 0 ? up : down);
    if (Math.abs(d) > 0.003) moving = true;
  }
  const fading = vizPalStep(t);
  vizDraw(c);
  if (moving || fading || !stale) VZ.raf = requestAnimationFrame(vizFrame);
}
function vizDraw(c){
  const k = scale() * (window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(c.clientWidth * k)), h = Math.max(1, Math.round(c.clientHeight * k));
  if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  const x = c.getContext('2d');
  x.clearRect(0, 0, w, h);
  const bw = 4.4 * k, step = bw + 3.2 * k;
  const half = Math.max(3, Math.floor((w / 2 - bw) / step) + 1), mid = h / 2, amp = mid - bw / 2 - k;
  const key = `${w}|${VZ.pal.map(p => p.map(Math.round).join(',')).join('|')}`;
  if (!VZ.grad || VZ.gkey !== key || VZ.gc !== c){
    // середина — главный цвет, к краям — второй и третий, каждый своей полосой с короткими переходами:
    // противоположные цвета (синий и жёлтый) в долгом переходе дали бы серое, через круг оттенков — зелёное
    const g = x.createLinearGradient(0, 0, w, 0), [a, b, e] = VZ.pal, near = hueGap(a, b) < 90;
    const stops = [[0, e, .35], [.07, e, .8], [.15, b, 1], [.29, b, 1], ...(near ? [[.345, hsvMix(b, a, .5), 1]] : []),
      [.4, a, 1], [.5, a, 1]];
    for (const [o, col, al] of stops){
      const rgba = `rgba(${col.map(Math.round).join(',')},${al})`;
      g.addColorStop(o, rgba); if (o < .5) g.addColorStop(1 - o, rgba);
    }
    VZ.grad = g; VZ.gkey = key; VZ.gc = c;
  }
  let peak = 0;
  x.beginPath();
  for (let j = 0; j < half; j++){
    const p = (half > 1 ? j / (half - 1) : 0) * (VZ_N - 1), i = Math.floor(p), f = p - i;
    const v = VZ.cur[i] * (1 - f) + (VZ.cur[Math.min(VZ_N - 1, i + 1)] || 0) * f;
    const hh = Math.max(0, v) * amp;
    if (v > peak) peak = v;
    x.moveTo(w / 2 + j * step, mid - hh); x.lineTo(w / 2 + j * step, mid + hh);
    if (j){ x.moveTo(w / 2 - j * step, mid - hh); x.lineTo(w / 2 - j * step, mid + hh); }
  }
  x.lineCap = 'round'; x.strokeStyle = VZ.grad;
  const alive = 0.4 + 0.6 * Math.min(1, peak * 2.5);       // в тишине — приглушённая точечная линия
  x.globalAlpha = 0.2 * alive; x.lineWidth = bw * 2.6; x.stroke();     // мягкое свечение
  x.globalAlpha = alive; x.lineWidth = bw; x.stroke();
  x.globalAlpha = 1;
}
// цвета — из обложки трека (2–3 самых заметных насыщенных оттенка), без обложки — цвет плеера; смена — плавно
function vizArt(){
  const m = S.media || {};
  if (S.cfg.vizColor === 'manual'){                                          // цвета выбраны в настройках
    const z = vizZones(), key = 'manual:' + z.join(',');
    if (key !== VZ.art){ VZ.art = key; vizPalTo(z.map(hexRgb)); }
    return;
  }
  const key = m.art ? 'art:' + m.art : 'brand:' + (m.player || S.cfg.player || '') + ':' + (S.view || '');
  if (key === VZ.art) return;
  VZ.art = key;
  if (!m.art){ vizPalTo(vizFallback()); return; }
  const img = new Image();
  img.onload = () => { if (VZ.art === key) vizPalTo(artPalette(img) || vizFallback()); };
  img.onerror = () => { if (VZ.art === key) vizPalTo(vizFallback()); };
  img.src = `/art?v=${encodeURIComponent(m.art)}`;
}
const rgbHex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const hueGap = (c1, c2) => { const d = Math.abs(hex2hsv(rgbHex(c1)).h - hex2hsv(rgbHex(c2)).h) % 360; return Math.min(d, 360 - d); };
// смесь двух цветов по кругу оттенков (короткой дугой), насыщенность и яркость — посередине
function hsvMix(c1, c2, t){
  const a = hex2hsv(rgbHex(c1)), b = hex2hsv(rgbHex(c2));
  if (a.s < .08) a.h = b.h; if (b.s < .08) b.h = a.h;          // у серого оттенка нет — берём у соседа
  const dh = ((b.h - a.h + 540) % 360) - 180;
  return hexRgb(hsv2hex((a.h + dh * t + 360) % 360, a.s + (b.s - a.s) * t, a.v + (b.v - a.v) * t));
}
// на тёмном фоне дека: насыщенно и светло, иначе полосы сольются с фоном
const vivid = (c, dh = 0) => { const q = hex2hsv(rgbHex(c)); return hexRgb(hsv2hex((q.h + dh + 360) % 360, Math.max(q.s, .5), Math.max(q.v, .82))); };
function vizFallback(){
  const m = S.media || {}, br = BRAND[m.player] || BRAND[S.cfg.player] || BRAND.other;
  const a = br.rgb.split(',').map(Number), b = hexRgb(HEX6.test(acc(S.view)) ? acc(S.view) : '#A78BFA');
  return [vivid(a), vivid(b), vivid(a, 40)];
}
function artPalette(img){
  const N = 40, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d', {willReadFrequently:true});
  let d;
  try { x.drawImage(img, 0, 0, N, N); d = x.getImageData(0, 0, N, N).data; } catch (e) { return null; }
  const bins = Array.from({length:24}, () => [0, 0, 0, 0]);       // по 15° оттенка: вес, r, g, b
  let total = 0;
  for (let i = 0; i < d.length; i += 4){
    const r = d[i], g = d[i + 1], b = d[i + 2], mx = Math.max(r, g, b), dd = mx - Math.min(r, g, b);
    const v = mx / 255, s = mx ? dd / mx : 0;
    if (v < .2 || s < .25) continue;          // тёмное и серое — не акцент
    let hh = mx === r ? ((g - b) / dd) % 6 : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;
    hh = (hh * 60 + 360) % 360;
    const wgt = s * s * v, q = bins[Math.floor(hh / 15) % 24];
    q[0] += wgt; q[1] += r * wgt; q[2] += g * wgt; q[3] += b * wgt; total += wgt;
  }
  if (total < 4) return null;                 // почти серая обложка — цвета плеера
  const order = bins.map((q, k) => ({q, k})).filter(o => o.q[0] > 0).sort((a, b) => b.q[0] - a.q[0]);
  const pick = [];
  for (const o of order){
    if (pick.length === 3 || o.q[0] < order[0].q[0] * .06) break;
    if (pick.some(p => { const dk = Math.abs(p.k - o.k); return Math.min(dk, 24 - dk) < 3; })) continue;   // ближе 45° — тот же цвет
    pick.push(o);
  }
  const cols = pick.map(({q}) => vivid([q[1] / q[0], q[2] / q[0], q[3] / q[0]]));
  while (cols.length < 3) cols.push(vivid(cols[0], cols.length === 1 ? 32 : -32));   // один оттенок — соседние к нему
  return cols;
}
function vizPalTo(cols){
  VZ.from = VZ.pal.map(c => c.slice()); VZ.to = cols.map(c => c.slice()); VZ.t0 = performance.now(); vizKick();
}
function vizPalStep(t){
  if (!VZ.to) return false;
  const p = Math.min(1, (t - VZ.t0) / 900), e = p * p * (3 - 2 * p);
  VZ.pal = VZ.from.map((c, i) => c.map((v, j) => v + (VZ.to[i][j] - v) * e));
  if (p >= 1) VZ.to = null;
  return true;
}

function renderPickList(){
  const P = S.picker, box = $('#plist'); if (!P || !box) return;
  const G = P.groupIndex != null ? (S.layouts[S.view] || [])[P.groupIndex] : null;

}
// перетаскивание панели / её уголка по схеме — шаг сетки
(function lyDrag(){
  let d = null;
  const cell = e => { const c = $('#lyCanvas').getBoundingClientRect(), L = S.look.layout;
    return {x:(e.clientX - c.left) / c.width * L.cols, y:(e.clientY - c.top) / c.height * L.rows}; };
  document.addEventListener('pointerdown', e => {
    if (!S.look || !S.look.ly) return;
    const rz = e.target.closest('[data-lyrz]'), bx = e.target.closest('[data-ly]');
    if (!bx) return;
    const p = S.look.layout.panels.find(q => q.id === bx.dataset.ly); if (!p) return;
    const c = cell(e);
    d = {p, rz:!!rz, sx:c.x, sy:c.y, o:{x:p.x, y:p.y, w:p.w, h:p.h}, moved:false};
    e.preventDefault();
  }, true);
  document.addEventListener('pointermove', e => {
    if (!d) return;
    const c = cell(e), L = S.look.layout, p = d.p, dx = Math.round(c.x - d.sx), dy = Math.round(c.y - d.sy);
    const n = d.rz ? {x:p.x, y:p.y, w:Math.max(1, Math.min(L.cols - p.x, d.o.w + dx)), h:Math.max(1, Math.min(L.rows - p.y, d.o.h + dy))}
      : {x:Math.max(0, Math.min(L.cols - p.w, d.o.x + dx)), y:Math.max(0, Math.min(L.rows - p.h, d.o.y + dy)), w:p.w, h:p.h};
    // на чужую панель не налезаем: такое место пропускаем, панель остаётся на последнем свободном
    if (L.panels.some(q => q !== p && n.x < q.x + q.w && q.x < n.x + n.w && n.y < q.y + q.h && q.y < n.y + n.h)) return;
    Object.assign(p, n);
    if (dx || dy) d.moved = true;
    const bx = document.querySelector(`#lyEd [data-ly="${CSS.escape(p.id)}"]`);
    if (bx){ bx.style.left = `calc(${p.x} * 100% / ${L.cols} + 3px)`; bx.style.top = `calc(${p.y} * 100% / ${L.rows} + 3px)`;
      bx.style.width = `calc(${p.w} * 100% / ${L.cols} - 6px)`; bx.style.height = `calc(${p.h} * 100% / ${L.rows} - 6px)`; }
  }, true);
  document.addEventListener('pointerup', () => { if (!d) return; S.look.lySel = d.p.id; d = null; lyEdRender(); }, true);
})();

// ---------- API для модов с кодом (mod.js): window.DeckAPI ----------
// DeckAPI.on(событие, fn) — 'message' (каждое сообщение ПК; false — дек его не обработает), 'press' ({mode, index, item};
// false — не нажимать), 'render:home' / 'render:mode' / 'render:dock' / 'render:layout' (элемент); DeckAPI.panel(вид,
// {name:{ru,uk}, render(el, opts, ctx), opts:[{k, label, def}]}) — своя панель для компоновки; DeckAPI.home(fn(el)) —
// свой главный экран целиком (false — обычный); act / send / toast / openMode / S / T / esc / icons / css(текст).
const DeckAPI = window.DeckAPI = {
  version:1, _on:{}, _panels:{}, _home:null, _errs:0,
  on(ev, fn){ (this._on[ev] = this._on[ev] || []).push(fn); return () => { this._on[ev] = this._on[ev].filter(f => f !== fn); }; },
  panel(kind, def){ if (/^[a-z0-9][a-z0-9_-]{0,30}$/.test(kind) && def && typeof def.render === 'function'){ this._panels[kind] = def; } },
  home(fn){ this._home = typeof fn === 'function' ? fn : null; },
  act(name, data){ const el = document.createElement('div'); el.dataset.act = name; Object.assign(el.dataset, data || {}); act(el); },
  send(m){ send(m); }, toast(t){ toast(String(t)); }, openMode(id){ openMode(id); }, goHome(){ goHome(); },
  get S(){ return S; }, T, esc, icons:I,
  css(text){ const st = document.createElement('style'); st.textContent = String(text); document.head.appendChild(st); return st; },
  render(){ renderView(); renderDock(); }};
function modErr(e){
  console.error('[мод]', e);
  if (DeckAPI._errs++ < 3) toast(T('Error in mod: ', 'Помилка в моді: ') + (e && e.message || e));
  try { window.__errs.push('[мод] ' + String(e && (e.stack || e.message) || e).slice(0, 300)); window.__errFlush(); } catch (x) {}
}
{ const base = renderView;                          // после экрана режима — событие для модов
  renderView = function(){ base(); if (!S.pad && !isHome()) modEmit('render:mode', $('#view')); }; }
function modEmit(ev, arg){                          // false от любого обработчика — «не делай по-своему»
  let res;
  for (const fn of DeckAPI._on[ev] || []){ try { if (fn(arg) === false) res = false; } catch (e){ modErr(e); } }
  return res;
}

      : T('Plugins add new things to the deck: games, devices, apps. On update the previous version with its settings is kept — you can restore it.', 'Плагіни додають деку нове: ігри, пристрої, програми. Під час оновлення попередня версія з налаштуваннями зберігається — її можна повернути.')}</div></div>`;

// ---------- обновления с GitHub (решает и делает ПК, тут — состояние и кнопки) ----------
function fmtDay(d){
  const t = new Date(d); if (isNaN(t)) return '';
  const loc = LOC();
  return t.toLocaleDateString(loc, {day:'numeric', month:'short'}) + ', ' + t.toLocaleTimeString(loc, {hour:'2-digit', minute:'2-digit'});
}
// «Лог изменений»: что нового в установленной версии дека и (если вышла) в новой — пункты для людей из server/changelog.py
function changesHtml(){
  const U = S.upd || {}, L = S.changelog;
  const day = d => { const [y, mo, dd] = String(d).split('-').map(Number); return y ? new Date(y, mo - 1, dd).toLocaleDateString(LOC(), {day:'numeric', month:'long', year:'numeric'}) : esc(d); };
  const block = e => `<div style="display:flex;flex-direction:column;gap:6px"><div class="fsec">${esc(day(e.date))}</div>
    ${e.items.map(i => `<div class="row" style="gap:10px;align-items:flex-start;font-size:14px;line-height:1.45"><span style="color:var(--acc);flex:0 0 auto">•</span><span>${esc(UK() ? i.uk : T(i.en || i.ru || i.uk, i.uk))}</span></div>`).join('')}</div>`;
  const fresh = U.state === 'ahead' && (U.changes || []).length ? `<div class="dgc" style="border-color:var(--acc);gap:12px">

      <div class="row" style="gap:8px"><button class="btn" data-act="updNow" style="border:none;color:#0E1014;font-weight:800;background:var(--acc)">${T('Refresh', 'Оновити')}</button></div></div>` : '';
  if (!L) return fresh + `<div style="color:var(--mu)">${T('Loading…', 'Завантажую…')}</div>`;
  return fresh + `<div class="lbl">${T('Installed version', 'Встановлена версія')}</div>`
    + (L.length ? L.map(block).join('') : `<div style="color:var(--mu)">${T('No entries yet.', 'Записів поки немає.')}</div>`);
}
function updHtml(){

  if (!U.can) return head + note(U.layout === 'git'
    ? T('The deck runs from a git copy — update with git pull.', 'Дек запущено з копії git — оновлюй командою git pull.')

  const ver = v => v ? `${esc(fmtDay(v.date))} · <span class="mono-f">${esc(v.sha.slice(0, 7))}</span> — ${esc(v.msg)}` : T('unknown', 'невідома');
  const busy = {check:T('Checking GitHub…', 'Перевіряю GitHub…'), download:T('Downloading the new version…', 'Завантажую нову версію…'),
    build:T('Preparing the new version…', 'Готую нову версію…'), pick:T('Waiting for an archive to be picked on the PC…', 'Чекаю, поки на ПК оберуть архів…'),

  return `${head}
    ${note(`${T('Now', 'Зараз')}: ${ver(U.local)}${U.local && U.local.branch && U.local.branch !== 'main' ? ` · ${T('branch', 'гілка')} ${esc(U.local.branch)}` : ''}`, 'var(--tx2)')}
    <div id="updStatus" style="font-size:13.5px;font-weight:700;line-height:1.45;color:${col}">${status}${U.skipped && main ? ` <span style="color:#FFB547;font-weight:600">· ${T('didn\'t install last time', 'минулого разу не встановилася')}</span>` : ''}</div>

    <div class="row" style="gap:8px;flex-wrap:wrap">

const SCW = {wait:['пауза', 'ждать', 'жди', 'чекати', 'зачекати', 'wait', 'sleep', 'delay'], text:['текст', 'набрать', 'набрати', 'text', 'type', 'send'],
  hold:['держать', 'зажать', 'тримати', 'затиснути', 'hold'], mode:['режим', 'mode'], run:['запуск', 'запустить', 'запустити', 'открыть', 'відкрити', 'run', 'start', 'open'],
  close:['закрыть', 'закрити', 'close'], out:['выход', 'вихід', 'output'], vol:['громкость', 'гучність', 'volume'], mic:['микрофон', 'мікрофон', 'mic'], lamp:['лампа', 'lamp']};
const SC_ON = ['вкл', 'включить', 'увімк', 'ввімкнути', 'on', '1'], SC_OFF = ['выкл', 'выключить', 'вимк', 'вимкнути', 'off', '0'];
function scMs(v){
  const m = /^\s*(\d+(?:[.,]\d+)?)\s*(мс|ms|с|сек|s|sec)?\s*$/i.exec(v || ''); if (!m) return null;

  return Math.round(['с', 'сек', 's', 'sec'].includes(u) ? n * 1000 : n);
}
function scBlock(line){

  const is = k => SCW[k].includes(word);

  if (is('text')) return rest ? {k:'text', v:line.replace(/^\s*\S+\s/, '')} : raw;
  if (is('hold')){ const m = /^(.+?)\s+(\S+)$/.exec(rest), ms = m && scMs(m[2]); return ms == null ? raw : {k:'hold', combo:m[1].replace(/\s+/g, '').toLowerCase(), ms}; }
  for (const k of ['mode', 'run', 'close', 'out']) if (is(k)) return rest ? {k, v:rest} : raw;
  if (is('vol')){ const i = rest.lastIndexOf(' '), num = i < 0 ? rest : rest.slice(i + 1), v = parseInt(num, 10);
    return isNaN(v) || v < 0 || v > 100 ? raw : {k:'vol', who:i < 0 ? '' : rest.slice(0, i).trim(), v}; }
  if (is('lamp')){ const v = parseInt(rest, 10); return isNaN(v) || v < 0 || v > 100 ? raw : {k:'lamp', v}; }

function scLine(b){

function scStatus(){
  const el = $('#scStatus'); if (!el || !S.sc) return;
  const m = S.sc.info;
  if (!m){ el.innerHTML = ''; return; }
  document.querySelectorAll('.scc.err').forEach(c => c.classList.remove('err'));
  document.querySelectorAll('.sce').forEach(c => { c.style.display = 'none'; });
  if (m.errors && m.errors.length && S.sc.view === 'blocks')        // строка n — карточка n-1 (пустых строк в блоках нет)
    for (const [n, e] of m.errors){ const c = document.querySelector(`.scc[data-i="${n - 1}"]`), x = document.querySelector(`[data-sce="${n - 1}"]`);
      if (c) c.classList.add('err'); if (x){ x.textContent = e; x.style.display = ''; } }
  if (m.errors && m.errors.length){
    el.style.color = '#FF8E8A';
    el.textContent = m.errors.map(([n, e]) => (n ? T('Line {0}: ', 'Рядок {0}: ', n) : '') + e).join(' · ');
    return;
  }
  el.style.color = m.steps ? 'var(--green)' : 'var(--mu)';
  el.textContent = m.steps ? `✓ ${T('steps', 'кроків')}: ${m.steps} · ${T('one run', 'один прогін')} ≈ ${DEC(m.secs)}${T(' s', ' с')}`
    : T('Empty — add lines', 'Порожньо — додай рядки');
}

// вставить строку туда, где курсор (или в конец), и поставить курсор после неё
function scInsert(line, caretInLine){
  const ta = $('#scText'); if (!ta || !S.sc) return;
  const v = ta.value, pos = S.sc.pos != null ? Math.min(S.sc.pos, v.length) : v.length;
  const before = v.slice(0, pos), after = v.slice(pos);
  const pre = before && !before.endsWith('\n') ? '\n' : '', post = after && !after.startsWith('\n') ? '\n' : '';
  ta.value = before + pre + line + post + after;
  const cur = (before + pre).length + (caretInLine == null ? line.length : caretInLine);
  S.sc.text = ta.value; S.sc.pos = cur;
  ta.focus(); ta.setSelectionRange(cur, cur);
  scCheck();
}

function apkOld(){
  if (!APP || !S.apk || !S.apkSha) return false;

// ---------- тосты ----------
// карточка в стиле дека встаёт на место визуализатора (он на это время прячется); нет визуализатора — в шапку
// между заголовком и кнопками. opt: ms — сколько держать, act — что сделать по тапу, color — точка, force — даже
// если «Подсказки» выключены (обновление)
let toastT;
function toast(text, opt = {}){
  if (S.cfg.toasts === false && !opt.force) return;
  const el = $('#toast');
  el.innerHTML = `<span class="tdot" style="background:${opt.color || (S.view ? acc(S.view) : 'var(--acc)')}"></span><span class="tt">${esc(text)}</span>${opt.act ? `<span class="tgo">${T('Open', 'Відкрити')} ›</span>` : ''}`;
  if (opt.act){ el.dataset.act = opt.act; el.classList.add('link'); } else { delete el.dataset.act; el.classList.remove('link'); }
  placeToast(el);
  el.classList.add('show'); $('#stage').classList.add('toasting');
  clearTimeout(toastT); toastT = setTimeout(hideToast, opt.ms || 3200);
}
function hideToast(){ const el = $('#toast'); el.classList.remove('show', 'link'); delete el.dataset.act; $('#stage').classList.remove('toasting'); }
function placeToast(el){
  const main = $('#main'), k = scale() || 1, mr = main.getBoundingClientRect();
  const c = document.querySelector('#saver canvas.viz') || vizCanvas();
  let x, y, w;
  if (c && c.clientWidth > 120){
    const r = c.getBoundingClientRect();
    x = (r.left - mr.left) / k; w = r.width / k; y = (r.top - mr.top) / k + (r.height / k - 44) / 2;
  } else {
    const mw = mr.width / k; w = Math.min(520, mw - 380); x = (mw - w) / 2; y = 24;
  }
  el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(Math.max(8, y)) + 'px'; el.style.width = Math.round(Math.max(220, w)) + 'px';
}

// закрывает прежнее, а переходы из дока (режим, главный, саундпад, правка) — все окна
function closeWindows(keep){
  tmClose();
  if (keep !== 'pscreen') S.pscreen = null;
  if (keep !== 'settings') S.settings = false;
  if (keep !== 'padCfg' && S.padCfg){ S.padCfg = false; padMeterOn(false); }
  if (keep !== 'picker') S.picker = null;
  if (keep !== 'group' && S.group != null){
    const G = (S.layouts[S.view] || [])[S.group], i = $('#grpName');
    if (G && i && i.value.trim() && i.value.trim() !== G.label){ G.label = i.value.trim(); saveLayout(); }
    S.group = null;
  }

  if (t.id === 'scText'){ S.sc.text = t.value; S.sc.pos = t.selectionStart; scCheck(); return; }
  if (t.dataset.sb != null && S.sc){ scField(t); return; }
  if (t.id === 'lcHex'){ lcHex(t.value); return; }
  if (t.dataset.lk && S.look){ lookSet(t.dataset.lk, t.type === 'range' ? +t.value : t.value, true); return; }
  if (t.dataset.lyo && S.look){ lyOpt(t); return; }
  if (t.id === 'scLabel'){ S.sc.label = t.value; return; }
  if (t.id === 'wlName' && S.wl){ S.wl.name = t.value; return; }
  if (t.dataset.cxl != null && S.ctx){ S.ctx.rows[+t.dataset.cxl].label = t.value; return; }
  if (t.dataset.cxs != null && S.ctx){ S.ctx.rows[+t.dataset.cxs].script = t.value; return; }
  if (t.id === 'scRepN'){ S.sc.repeat = Math.max(1, Math.min(1000, parseInt(t.value, 10) || 1)); return; }
  if (t.dataset.padvol){
    const k = t.dataset.padvol; S.cfg[k] = +t.value; t.nextElementSibling.textContent = t.value + '%';
    clearTimeout(volT[k]); volT[k] = setTimeout(() => send({t:'cfg', cfg:{[k]: +t.value}}), 120); return; }
  if (t.id === 'brightR'){                       // яркость дека — сразу в приложение (сервер не нужен)
    try { APP.setBrightness(+t.value / 100); } catch (e) {}
    t.style.opacity = ''; t.nextElementSibling.textContent = t.value + '%';
    const a = document.querySelector('[data-act="brightAuto"]'); if (a) a.classList.remove('on'); return; }
  if (t.dataset.cw){ const W = wheelOf(); if (W){ W[t.dataset.cw] = +t.value / 100; cwPaint(); } return; }
  if (t.type !== 'range') return;
  dragging = true; t.nextElementSibling.textContent = t.value + '%';
  const target = t.dataset.target;
  clearTimeout(volT[target]); volT[target] = setTimeout(() => send({t:'vol', target, value:+t.value}), 60);
});
// курсор в скрипте запоминаем, когда уходят на кнопки «добавить строку»
stage.addEventListener('focusout', e => { if (e.target.id === 'scText' && S.sc) S.sc.pos = e.target.selectionStart; });
// поле карточки шага → блок → текст (без перерисовки: фокус и курсор остаются)
function scField(t){
  const b = S.sc.blocks[+t.dataset.sb]; if (!b) return;
  const f = t.dataset.f;
  if (f === 'ms' || (f === 'v' && (b.k === 'vol' || b.k === 'lamp'))){
    const max = f === 'ms' ? 60000 : 100, v = Math.max(0, Math.min(max, parseInt(t.value, 10) || 0)); b[f] = v; }
  else if (f === 'on') b.on = t.value === '1';
  else b[f] = t.value;
  scSync();
}
stage.addEventListener('change', e => {
  if (e.target.dataset.sb != null && S.sc){ scField(e.target); return; }
  if (e.target.id === 'lookFile' && S.look){ lookPick(e.target.files && e.target.files[0]); e.target.value = ''; return; }
  if (e.target.dataset.lyo && S.look){ lyOpt(e.target); return; }   // без перерисовки: change приходит на уходе фокуса — кнопку под пальцем не трогаем
  if (e.target.dataset.lk && S.look){ lookSet(e.target.dataset.lk, e.target.type === 'range' ? +e.target.value : e.target.value); return; }
  if (e.target.tagName === 'SELECT' && e.target.dataset.p){ send({t:'plugin', id:e.target.dataset.p, a:e.target.dataset.a, v:e.target.value}); return; }
  if (e.target.dataset.cfgsel){
    const k = e.target.dataset.cfgsel, v = e.target.value;
    S.cfg[k] = v; applyTheme(); renderOverlay(); renderView(); renderDock(); send({t:'cfg', cfg:{[k]: v}}); return; }
  if (e.target.dataset.cfgnum){ const k = e.target.dataset.cfgnum; S.cfg[k] = +e.target.value; send({t:'cfg', cfg:{[k]: +e.target.value}}); saverArm(); return; }
  if (e.target.id === 'dockW'){ send({t:'cfg', cfg:{dockW:S.cfg.dockW}}); return; }
  if (e.target.type === 'range') setTimeout(() => { dragging = false; }, 400);
  if (e.target.dataset.rf){ S.rf = {...rfForm(), [e.target.dataset.rf]:e.target.value}; keepScroll(renderOverlay); }
});

// ---------- выпадающие списки в стиле дека ----------
// <select> в разметке остаются (их значения и события change/input — как раньше), но прячутся: вместо них — кнопка
// с выбранным пунктом, а тап открывает свой список рядом с ней. Новые <select> подхватываются сами (MutationObserver)
const XCHEV = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function xselWrap(sel){
  if (sel.dataset.fx) return;
  sel.dataset.fx = '1';
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'xsel ' + sel.className; b.style.cssText = sel.style.cssText;
  b.setAttribute('aria-haspopup', 'listbox'); b.setAttribute('aria-label', sel.getAttribute('aria-label') || '');
  b.innerHTML = `<span class="xv"></span>${XCHEV}`;
  b.addEventListener('click', e => {
    e.stopPropagation(); swallow = false;
    // повторный тап по той же кнопке закрывает список: подложка уже закрыла его на pointerdown — не открываем снова
    if (xpopShut.b === b && Date.now() - xpopShut.t < 700){ xpopShut.b = null; return; }
    xpopOpen(sel, b);
  });
  sel.hidden = true; sel.after(b); xselText(sel, b);
}
function xselText(sel, b){ const o = sel.options[sel.selectedIndex]; b.querySelector('.xv').textContent = o ? o.textContent : ''; }
const xpopShut = {b:null, t:0};        // какой список только что закрыли тапом мимо и когда
function xpopClose(){
  const p = $('#xpop'), bg = $('#xpopBg'); if (p) p.remove(); if (bg) bg.remove();
  document.querySelectorAll('.xsel.open').forEach(x => x.classList.remove('open'));
}
function xpopOpen(sel, b){
  xpopClose(); haptic(8);
  const st = $('#stage'), k = scale() || 1, r = b.getBoundingClientRect(), s = st.getBoundingClientRect();
  const bg = document.createElement('div'); bg.id = 'xpopBg';
  bg.addEventListener('pointerdown', e => {
    e.stopPropagation(); e.preventDefault();
    const hit = document.elementsFromPoint(e.clientX, e.clientY).find(x => x !== bg && x.id !== 'xpop');
    xpopShut.b = hit && hit.closest ? hit.closest('.xsel') : null; xpopShut.t = Date.now();
    xpopClose(); swallow = true;
  });
  const p = document.createElement('div'); p.id = 'xpop'; p.className = 'xpop'; p.setAttribute('role', 'listbox');
  p.innerHTML = [...sel.options].map((o, i) => `<button type="button" class="xo${i === sel.selectedIndex ? ' on' : ''}" role="option" aria-selected="${i === sel.selectedIndex}" data-i="${i}"><span>${esc(o.textContent)}</span>${i === sel.selectedIndex ? I.check : ''}</button>`).join('');
  p.addEventListener('click', e => {
    e.stopPropagation();
    const o = e.target.closest('.xo'); if (!o) return;
    const i = +o.dataset.i; xpopClose(); haptic(10);
    if (i === sel.selectedIndex) return;
    sel.selectedIndex = i; xselText(sel, b);
    sel.dispatchEvent(new Event('input', {bubbles:true})); sel.dispatchEvent(new Event('change', {bubbles:true}));
  });
  st.appendChild(bg); st.appendChild(p);
  // рядом с кнопкой: ниже, а не влезает — выше; не уже кнопки и не за краем экрана
  const W = 1170, H = 540, w = Math.max(r.width / k, 160), x = Math.min(Math.max(8, (r.left - s.left) / k), W - w - 8);
  const below = (r.bottom - s.top) / k + 6, above = (r.top - s.top) / k - 6, h = Math.min(p.scrollHeight, H - 16);
  p.style.width = w + 'px'; p.style.left = x + 'px'; p.style.maxHeight = (H - 16) + 'px';
  if (below + h <= H - 8 || below > H - above){ p.style.top = Math.min(below, H - 8 - h) + 'px'; }
  else { p.classList.add('up'); p.style.top = Math.max(8, above - h) + 'px'; }
  const on = p.querySelector('.xo.on'); if (on) p.scrollTop = Math.max(0, on.offsetTop - p.clientHeight / 2);     // не scrollIntoView: он листает и страницу
  b.classList.add('open');
}
new MutationObserver(() => { document.querySelectorAll('#stage select:not([data-fx])').forEach(xselWrap); if ($('#xpop') && !$('.xsel.open')) xpopClose(); })
  .observe(document.getElementById('stage'), {childList:true, subtree:true});

// ---------- старый WebView без gap во flex (Chrome < 84: Huawei P Smart Z — 83) ----------
// Вся вёрстка на flex + gap; там gap у flex просто не работает — всё слипается. Подставляем отступы сами:
// ребёнку (кроме последнего) — margin-right / margin-bottom по направлению ряда, с переносом — и то и другое.
// Только там, где gap не работает (или ?nogap=1 — проверить на новом браузере), и только по изменённым местам.
const FLEX_GAP = (() => {
  if (/[?&]nogap=1/.test(location.search)) return false;
  const d = document.createElement('div');
  d.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
  d.appendChild(document.createElement('div')); d.appendChild(document.createElement('div'));
  document.body.appendChild(d); const ok = d.scrollHeight === 1; d.remove(); return ok;
})();
const GAP_FORCE = /[?&]nogap=1/.test(location.search);
function gapFix(root){
  const els = root.querySelectorAll ? [root, ...root.querySelectorAll('*')] : [];
  for (const el of els){
    if (!(el instanceof HTMLElement)) continue;
    const cs = getComputedStyle(el);
    if (cs.display !== 'flex' && cs.display !== 'inline-flex'){ if (el.dataset.gfx) gapUndo(el); continue; }
    // ?nogap=1: свой gap мы обнулили — помним исходный (на старом WebView gap в стилях остаётся, просто не работает)
    const cg = el.dataset.gcg != null ? +el.dataset.gcg : parseFloat(cs.columnGap) || 0;
    const rg = el.dataset.grg != null ? +el.dataset.grg : parseFloat(cs.rowGap) || 0;
    if (!cg && !rg){ if (el.dataset.gfx) gapUndo(el); continue; }
    const row = cs.flexDirection.startsWith('row'), rev = cs.flexDirection.endsWith('reverse'), wrap = cs.flexWrap !== 'nowrap';
    // пункты ряда — и элементы, и куски текста (gap есть и между ними); отступ ставим элементу со стороны соседа
    // display:contents (#view) — его дети и есть пункты ряда
    const flat = n => [...n.childNodes].flatMap(k => k.nodeType === 1 && getComputedStyle(k).display === 'contents' ? flat(k) : [k]);
    const kids = flat(el).filter(k => k.nodeType === 3 ? k.textContent.trim() !== ''
      : k.nodeType === 1 && (c => c.display !== 'none' && c.position !== 'absolute' && c.position !== 'fixed')(getComputedStyle(k)));
    if (GAP_FORCE && el.dataset.gcg == null){ el.dataset.gcg = cg; el.dataset.grg = rg; el.style.columnGap = '0px'; el.style.rowGap = '0px'; }
    el.dataset.gfx = '1';
    const end = row ? (rev ? 'marginLeft' : 'marginRight') : (rev ? 'marginTop' : 'marginBottom');
    const start = row ? (rev ? 'marginRight' : 'marginLeft') : (rev ? 'marginBottom' : 'marginTop');
    const cross = row ? 'marginBottom' : 'marginRight', g = row ? cg : rg;
    kids.forEach((k, i) => {
      if (k.nodeType !== 1) return;
      const next = kids[i + 1], prev = kids[i - 1];
      gapSet(k, end, next || wrap ? g : 0);
      gapSet(k, start, prev && prev.nodeType === 3 ? g : 0);          // перед ним текст — отступ слева от элемента
      gapSet(k, cross, wrap ? (row ? rg : cg) : 0);
    });
    // с переносом: у последнего в строке нет отступа «дальше», у последней строки — «вниз» (как у настоящего gap)
    if (wrap){
      // строка — по перекрытию поперёк (пункты разной высоты по центру начинаются на разной высоте)
      const els = kids.filter(k => k.nodeType === 1);
      const a0 = k => row ? k.offsetTop : k.offsetLeft, a1 = k => a0(k) + (row ? k.offsetHeight : k.offsetWidth);
      const same = (x, y) => a0(y) < a1(x) && a0(x) < a1(y);
      const last = els[els.length - 1];
      els.forEach((k, i) => {
        if (!els[i + 1] || !same(k, els[i + 1])) gapSet(k, end, 0);
        if (last && same(k, last)) gapSet(k, cross, 0);
      });
    }
  }
}
// свой отступ ставим, только если у ребёнка нет своего в style (его не трогаем); помечаем — чтобы снять / пересчитать
// к отступу из CSS-класса (его запоминаем до своего) прибавляем gap
function gapSet(k, prop, v){
  const mark = 'g' + prop;
  if (k.style[prop] && k.dataset[mark] == null) return;
  if (v){
    if (k.dataset[mark] == null) k.dataset[mark] = parseFloat(getComputedStyle(k)[prop]) || 0;
    k.style[prop] = (+k.dataset[mark] + v) + 'px';
  } else if (k.dataset[mark] != null){ k.style[prop] = ''; delete k.dataset[mark]; }
}
function gapUndo(el){ delete el.dataset.gfx; for (const k of el.children) for (const p of ['marginRight', 'marginLeft', 'marginTop', 'marginBottom']) gapSet(k, p, 0); }
if (!FLEX_GAP){
  document.documentElement.classList.add('nogap');
  let todo = new Set(), queued = false;
  const run = () => { queued = false; const list = [...todo]; todo = new Set();
    for (const n of list) if (n.isConnected && !list.some(o => o !== n && o.contains(n))) gapFix(n); };
  new MutationObserver(ms => {
    for (const m of ms){
      const t = m.type === 'characterData' ? m.target.parentElement : m.target;
      if (!t || (m.type === 'attributes' && /^data-g/.test(m.attributeName || ''))) continue;
      if (m.type === 'attributes' && m.attributeName === 'style') continue;      // свои же отступы
      let up = t.parentElement || t;
      while (up.parentElement && getComputedStyle(up).display === 'contents') up = up.parentElement;
      todo.add(up.parentElement || up);
    }
    if (!queued && todo.size){ queued = true; requestAnimationFrame(run); }
  }).observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['class', 'hidden']});
  requestAnimationFrame(() => gapFix(document.body));
}

// ---------- масштаб под экран ----------
const scale = () => Math.min(window.innerWidth / 1170, window.innerHeight / 540);
function fit(){
  const s = scale();
  stage.style.transform = `scale(${s})`;
  stage.style.left = ((window.innerWidth - 1170 * s) / 2) + 'px';
  stage.style.top = ((window.innerHeight - 540 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);

// ---------- батарея телефона ----------
let devKey = '';
function pollDevice(){
  try {
    const d = JSON.parse(APP.status());
    const key = JSON.stringify(d);
    if (key === devKey) return;
    devKey = key; S.dev = d;
    S.battery = d.battery >= 0 ? {level:d.battery, charging:d.charging} : null;
    renderDock();
  } catch (e) {}
}
if (APP){ pollDevice(); setInterval(pollDevice, 5000); }
else if (navigator.getBattery) navigator.getBattery().then(b => {
  const upd = () => { S.battery = {level:b.level, charging:b.charging}; renderDock(); };
  b.addEventListener('levelchange', upd); b.addEventListener('chargingchange', upd); upd();
}).catch(() => {});

// кнопка «Назад» в приложении: закрывает верхнее окно, потом выходит из правки/режима
window.deckBack = () => {
  if (S.rulePick){ S.rulePick = null; renderOverlay(); return true; }
  if ($('#xpop')){ xpopClose(); return true; }
  if (S.vzWheel){ S.vzWheel = null; renderOverlay(); return true; }
  if (S.ctx){ S.ctx = null; renderOverlay(); return true; }
  if (S.center){ S.center = null; renderOverlay(); return true; }
  if (S.clipWin || S.devWin || S.wl){ S.clipWin = S.devWin = false; S.wl = null; renderOverlay(); return true; }
  if (S.diag){ S.diag = false; send({t:'diag', on:false}); renderOverlay(); return true; }
  if (S.sc){ if (S.sc.pick) S.sc.pick = null; else S.sc = null; renderOverlay(); return true; }
  if (S.hk){ S.hk = null; renderOverlay(); return true; }
  if (S.modeEdit){ if (S.modeEdit.wheel) S.modeEdit.wheel = null; else if (S.modeEdit.pal) S.modeEdit.pal = false; else S.modeEdit = null;
    renderOverlay(); return true; }
  if (S.pscreen){ S.pscreen = null; renderOverlay(); return true; }
  if (S.picker){ S.picker = null; renderOverlay(); return true; }
  if (S.group != null){
    const G = S.layouts[S.view][S.group], i = $('#grpName');
    if (G && i && i.value.trim()) G.label = i.value.trim();
    S.group = null; saveLayout(); renderOverlay(); renderView(); return true; }
  if (S.settings){ S.settings = false; renderOverlay(); return true; }
  if (S.padCfg){ S.padCfg = false; renderOverlay(); padMeterOn(false); return true; }
  if (S.mixer){ S.mixer = false; renderSheet(); return true; }
  if (S.pad){ S.pad = false; renderView(); renderDock(); return true; }
  if (S.delAsk){ S.delAsk = null; renderView(); return true; }
  if (S.edit){ S.edit = false; S.sel = null; S.hsel = null; renderView(); renderDock(); return true; }
  if (S.screen === 'mode'){ S.screen = 'home'; renderView(); renderDock(); return true; }
  return false;
};

try { S.cfg.lang = localStorage.getItem('deckLang') || 'en'; if (S.cfg.lang === 'ru') S.cfg.lang = 'uk'; } catch (e) {}
try { S.dockHide = localStorage.getItem('deckDockHide') === '1'; } catch (e) {}
dockHideApply(false);
applyLang(); fit(); renderView(); renderDock(); renderSheet(); connect();
setInterval(vizSync, 500);
document.addEventListener('visibilitychange', vizSync);
saverArm(); keepAwake(true);
</script>
