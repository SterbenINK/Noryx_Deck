<style>
@font-face{font-family:Manrope;src:local("Manrope")}
:root{--bg:#0E1014;--dock:#14171C;--card:#171A20;--card2:#1F232B;--line:#2A2F39;--line2:#4A5160;--tx:#E8EAEE;--tx2:#C3C9D4;--mu:#9AA3B2;--red:#F0544F;--green:#5BD18B;--sp:#1DB954;--acc:#4DA3FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* старые WebView (Huawei и т. п.) обводят нажатое оранжевой рамкой фокуса — у дека свои состояния */
*:focus{outline:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--tx);font-family:Manrope,"Segoe UI",Roboto,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
.mono-f{font-family:"JetBrains Mono",Consolas,"Roboto Mono",monospace}
#stage{position:absolute;left:0;top:0;width:1170px;height:540px;transform-origin:0 0;display:flex;background:var(--bg);overflow:hidden}
/* меню плитки (удержать и не двигать): как у рабочего стола телефона — название и действия над плиткой */
#tmenu{position:absolute;z-index:60;min-width:300px;max-width:560px;background:#20242C;border:1px solid var(--line2);border-radius:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);animation:tmIn .16s cubic-bezier(.2,.8,.2,1)}
@keyframes tmIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#tmenu .tmh{position:relative;z-index:1;background:#20242C;border-radius:21px 21px 0 0;padding:16px 18px 14px;font-size:17px;font-weight:800;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tmenu .tma{display:flex;background:#191C22;border-radius:0 0 21px 21px;overflow:hidden;position:relative;z-index:1}
#tmenu .tma button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 8px 12px;font-size:13px;font-weight:700;color:var(--tx2);min-width:84px;max-width:120px;white-space:normal;text-align:center;line-height:1.2}
#tmenu .tma button[aria-checked="true"]{color:var(--tx);background:rgba(255,255,255,.07)}
#tmenu .tma button:active{background:#262B34}
#tmenu .tma button svg{width:24px;height:24px}
#tmenu .tma button.del{color:var(--red)}
#tmenu .tmb{padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#191C22;border-radius:0 0 21px 21px;position:relative;z-index:1}
#tmenu input{height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--tx);font:inherit;font-size:15px;padding:0 12px;width:100%}
#tmenu .tmar{position:absolute;width:16px;height:16px;background:#191C22;border:1px solid var(--line2);transform:rotate(45deg)}
#main{flex:1 1 auto;min-width:0;position:relative;display:flex;flex-direction:column;padding:22px 24px 18px;gap:14px}
/* док можно спрятать, как трей Windows: кнопка-стрелка в правом нижнем углу плиток, плеер — в шапку (hmini) */
#stage.dockhide #dock{display:none}
#stage.dockshow #dock{animation:dockIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes dockIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#trayBtn{position:absolute;right:8px;bottom:12px;width:38px;height:38px;border-radius:12px;background:#1B1F27;border:1px solid var(--line);color:var(--tx2);display:flex;align-items:center;justify-content:center;z-index:3;padding:0}
#trayBtn svg{transition:transform .2s;width:18px;height:18px}
#trayBtn:active{background:#262B34}
#stage:not(.dockhide) #trayBtn svg{transform:rotate(90deg)}
.hmini{flex:0 1 300px;min-width:170px;display:flex;align-items:center;gap:6px}
.hmini .mq{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:800;line-height:16px}
.hmini .mq small{display:block;font-size:11px;font-weight:700;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.hmini .mqi{display:inline-block}
.hmini .mqi span{display:inline-block;padding-right:36px}
.hmini .mq.go .mqi{animation:mq var(--mqT,10s) linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* подсказка с жестами (tut*): на весь экран, повторить каждый жест, пропустить — только удержанием */
#tut{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(8,10,13,.97);display:flex;align-items:center;justify-content:center;touch-action:none}
#tut .tc{width:620px;max-width:92%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;pointer-events:none}
#tut .tc button{pointer-events:auto}
#tut .tdots{display:flex;gap:8px}
#tut .tdots i{width:9px;height:9px;border-radius:5px;background:#3A404B;display:block}
#tut .tdots i.on{background:var(--acc);width:24px}
#tut .tdots i.ok{background:#3BD16F}
#tut h2{margin:0;font-size:26px;font-weight:800}
#tut p{margin:0;font-size:16px;color:var(--tx2);line-height:1.45}
#tut .tdemo{position:relative;width:300px;height:170px;border-radius:22px;border:1px dashed #3A404B;background:rgba(255,255,255,.03);overflow:hidden}
#tut .tf{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 7px rgba(255,255,255,.18)}
#tut .tok{font-size:15px;font-weight:800;color:#3BD16F;min-height:20px}
#tut .tok.bad{color:#FF8A7A}
#tut .tskip{position:absolute;left:18px;bottom:16px;pointer-events:auto;overflow:hidden}
#tut .tskip b{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.12)}
#tut .tskip.hold b{width:100%;transition:width 1.5s linear}
#tut .tarr{position:absolute;right:8px;bottom:12px;width:38px;height:38px;border-radius:12px;background:#1B1F27;border:1px solid var(--line);color:var(--tx);display:flex;align-items:center;justify-content:center;animation:tPulse 1.2s ease-in-out infinite}
#tut .tarr svg{width:18px;height:18px}
#tut.shake .tc{animation:tShake .35s}
@keyframes tPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
@keyframes tShake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes tUp{0%{top:80%;left:50%;opacity:0}15%{opacity:1}75%{top:20%;opacity:1}100%{top:20%;opacity:0}}
@keyframes tLeft{0%{left:80%;top:50%;opacity:0}15%{opacity:1}75%{left:20%;opacity:1}100%{left:20%;opacity:0}}
@keyframes tInA{0%{left:22%;top:22%;opacity:0}15%{opacity:1}75%{left:44%;top:44%;opacity:1}100%{left:44%;top:44%;opacity:0}}
@keyframes tInB{0%{left:78%;top:78%;opacity:0}15%{opacity:1}75%{left:56%;top:56%;opacity:1}100%{left:56%;top:56%;opacity:0}}
@keyframes tOutA{0%{left:44%;top:44%;opacity:0}15%{opacity:1}75%{left:22%;top:22%;opacity:1}100%{left:22%;top:22%;opacity:0}}
@keyframes tOutB{0%{left:56%;top:56%;opacity:0}15%{opacity:1}75%{left:78%;top:78%;opacity:1}100%{left:78%;top:78%;opacity:0}}
@keyframes tHold{0%{opacity:0;box-shadow:0 0 0 0 rgba(255,255,255,.4)}15%{opacity:1}70%{opacity:1;box-shadow:0 0 0 22px rgba(255,255,255,0)}100%{opacity:0}}
.hmini .mbtn{flex:0 0 36px;width:36px;height:36px;border-radius:12px}
.hmini .pp{flex:0 0 38px;width:38px;height:38px;border-radius:19px}
#dock{width:var(--dockW,236px);flex:0 0 var(--dockW,236px);height:540px;background:var(--dock);border-left:1px solid var(--line);padding:18px 16px 16px;display:flex;flex-direction:column;gap:16px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700}
.row{display:flex;align-items:center}
.btn{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.btn.on{background:var(--tx);color:#0E1014}
/* home */
.home-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.modes{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mode-tile{border:1px solid var(--line);background:var(--card);border-radius:22px;text-align:center;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.mode-tile svg{transition:transform .15s}.mode-tile:active svg{transform:scale(.94)}
.mode-tile .n{font-size:26px;font-weight:800}.mode-tile .s{font-size:14px;color:var(--mu);margin-top:6px}
.mode-tile .sbx{display:inline-flex;flex-direction:column;align-items:stretch;max-width:100%;min-width:44px;vertical-align:top}
.mode-tile .bar{height:4px;border-radius:4px;margin:12px 0 0}
.modes > .cell > .mode-tile{flex:1 1 auto;width:100%}
.mode-tile.edit{border:1px dashed var(--line2)}.mode-tile.sel{border:2px solid var(--tx)}
/* больше двух режимов — маленькие плитки 2×2 по страницам */
.modes.sm{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;min-height:0}
.modes.sm .mode-tile{flex-direction:row;justify-content:flex-start;text-align:left;gap:20px;padding:16px 22px;border-radius:20px;min-width:0}
.modes.sm .mode-tile > div{min-width:0;flex:1 1 auto}
.modes.sm .mode-tile .n{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modes.sm .mode-tile .s{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.modes.sm .mode-tile .bar{margin:8px 0 0}
.ask{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:22px;background:rgba(14,16,20,.95);border:2px solid var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;font-weight:800;z-index:2}
/* mode */
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.mh .t{font-size:24px;font-weight:800;white-space:nowrap;flex:0 0 auto}
/* визуализатор в шапке: спектр того, что играет на ПК, цветами обложки трека (рисует vizFrame) */
.viz{flex:1 1 auto;min-width:60px;height:56px;margin:-11px 6px;display:block;pointer-events:none}
/* контекстные действия на плитке запущенной программы */
.ctxbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;justify-content:center;pointer-events:none}
.cx{pointer-events:auto;flex:1 1 0;min-width:0;max-width:120px;height:30px;border-radius:15px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-size:11.5px;font-weight:800;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.hasctx{padding-bottom:48px;gap:8px}
.tile.hasctx .sb{display:none}
#grid.mid .cx{height:26px;font-size:10.5px}
#grid.mid .tile.hasctx{padding-bottom:40px}
/* автопереключение и действия: поля */
.rf{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:0 10px;font:inherit;font-size:13px;min-width:0}
/* центр уведомлений, история, диагностика */
.bell{position:relative;display:flex;align-items:center;justify-content:center;width:24px;height:26px;border:none;background:none;color:var(--tx2);padding:0}
.clipi{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.clipi .tx{font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;user-select:text;-webkit-user-select:text}
.wlr{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%;background:var(--card2)}
.wlr.on{border-color:var(--green);background:#16261D}
.bdg{position:absolute;top:-4px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.evr{display:grid;grid-template-columns:44px 10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.evr .tm{font-size:12px;color:var(--mu)}
.evr .lv{width:8px;height:8px;border-radius:4px}
.dg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dgc{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dgb{height:8px;border-radius:4px;background:#262B34;overflow:hidden}.dgb>div{height:100%;border-radius:4px}
.hpl{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-top:1px solid var(--line)}.hpl:first-of-type{border-top:none}
.dgr{display:flex;justify-content:space-between;gap:10px;font-size:13px;min-width:0}.dgr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stats{cursor:pointer}
.home-h .viz{height:66px;margin:-4px 8px 0;align-self:center}
.dot{width:12px;height:12px;border-radius:6px}
.pill{font-size:13px;color:#0E1014;background:var(--tx);padding:6px 12px;border-radius:20px;font-weight:700}
#grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;min-height:0}
.cell{position:relative;display:flex;min-width:0;min-height:0}
.tile{flex:1 1 auto;width:100%;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:26px 12px 12px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:12px;text-align:center;min-width:0;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile.edit{border:1px dashed var(--line2)}.tile.sel{border:2px solid var(--tx)}
.tile.edit,.tile.sel{padding-top:16px}
.tile.dim{opacity:.55}
.ic{position:relative;width:54px;height:54px;border-radius:14px;background:#262B34;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;overflow:hidden;flex:0 0 auto}
.ic img{position:absolute;top:7px;right:7px;bottom:7px;left:7px;width:40px;height:40px;object-fit:contain;background:inherit}   /* фон — как у подложки: прозрачная PNG не даёт серого квадрата, буквы под ней не видны */
.tile .ic{width:88px;height:88px;border-radius:24px;font-size:26px}
.tile .ic img{top:12px;right:12px;bottom:12px;left:12px;width:64px;height:64px}
.tile .ic svg{width:46px;height:46px}
.tile .tx{width:100%;min-width:0}
.tile .nm{font-size:16px;font-weight:700;line-height:1.25;width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
.tile.edit .nm,.tile.sel .nm{-webkit-line-clamp:1}
.tile .sb{font-size:12px;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:6px;margin-top:3px}
.tile.edit .sb,.tile.sel .sb{display:none}
.run{width:7px;height:7px;border-radius:4px;background:var(--green)}
.plus{border:1.5px dashed var(--line2);border-radius:20px;color:var(--mu);display:flex;align-items:center;justify-content:center;flex:1 1 auto}
.gic{display:grid!important;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:5px;background:#262B34}
.gi{position:relative;border-radius:6px;background:#31363F;font-size:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;min-height:0}
.gi img{position:absolute;top:2px;right:2px;bottom:2px;left:2px;width:calc(100% - 4px);height:calc(100% - 4px);object-fit:contain;background:inherit}
.tile .gic{grid-template-columns:repeat(2,34px);grid-template-rows:none;grid-auto-rows:34px;gap:6px;padding:0;align-content:center;justify-content:center;align-items:stretch;justify-items:stretch}
.tile .gi{border-radius:9px;font-size:11px}
.tile .gi img{top:3px;right:3px;bottom:3px;left:3px;width:28px;height:28px}
.tile .gi:nth-child(3):last-child,.tile .gi:only-child{grid-column:1 / -1;justify-self:center;width:34px}
.au2{position:absolute;bottom:12px;right:12px;height:36px;border-radius:18px;border:none;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;font-weight:800;background:#262B34;color:var(--tx)}
.mrow{display:flex;gap:6px}
.mbtn{flex:1 1 0;height:48px;border-radius:14px;background:#262B34;color:var(--tx);display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:800;border:1px solid transparent;min-width:0}
.mbtn.on{background:rgba(29,185,84,.16);color:var(--sp);border-color:rgba(29,185,84,.55)}
.mbtn:active,.pp:active{transform:scale(.96)}
.au{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);height:36px;border-radius:18px;border:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 9px;font-size:12px;font-weight:800;white-space:nowrap}
.au.l{left:12px;transform:none}
.x{position:absolute;top:-10px;right:-10px;width:36px;height:36px;border-radius:18px;border:3px solid #0E1014;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
.pager{display:flex;justify-content:center;align-items:center;gap:10px}
.pg{width:44px;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.pd{height:10px;border-radius:5px;transition:width .2s}
/* sheet & overlays */
/* микшер — на всю высоту: вывод звука сеткой на всю ширину, ползунки — всё оставшееся место */
#sheet{position:absolute;left:16px;right:16px;top:12px;bottom:0;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:10px 24px 16px;display:flex;flex-direction:column;gap:10px;transform:translateY(calc(100% + 40px));transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 40px rgba(0,0,0,.45);z-index:5}
#sheet.open{transform:translateY(0)}
.handle{align-self:center;width:90px;height:22px;display:flex;align-items:center;justify-content:center}
.handle div{width:48px;height:5px;border-radius:3px;background:var(--line2)}
.mx-top{position:relative;min-height:36px;justify-content:space-between;gap:12px}
.mx-top .handle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ch{display:grid;grid-template-columns:170px minmax(0,1fr) 56px;align-items:center;gap:16px;min-height:40px}
.ch label{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch input{width:100%;height:34px;accent-color:var(--tx)}
.chs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;flex:1 1 auto;touch-action:pan-y;padding-right:4px;margin-top:2px}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;flex:0 0 auto}
.outs .btn{height:auto;min-height:44px;padding:6px 14px;justify-content:flex-start;text-align:left;font-size:13px;line-height:1.25;min-width:0}
.outs .btn span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.ov{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(8,9,12,.72);display:flex;padding:18px;z-index:8}
.dlg{width:100%;height:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-b{flex:1 1 auto;overflow-y:auto;padding:12px 14px;touch-action:pan-y}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.pi{height:56px;border-radius:14px;border:1px solid var(--line);background:#14171C;display:flex;align-items:center;gap:12px;padding:0 12px;text-align:left}
.pi.on{background:var(--card2)}
.pi .ic{width:36px;height:36px;border-radius:10px;font-size:13px}.pi .ic img{top:4px;right:4px;bottom:4px;left:4px;width:28px;height:28px}
.pi .nm{flex:1 1 auto;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;color:#0E1014;flex:0 0 auto}
.sw{min-height:52px;border-radius:14px;border:1px solid var(--line);background:#14171C;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;text-align:left;width:100%}
.tr{width:46px;height:26px;border-radius:13px;position:relative;flex:0 0 auto;transition:background .16s}
.kn{position:absolute;top:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .16s}
.swatch{flex:0 0 auto;width:44px;height:44px;border-radius:22px;border:3px solid transparent}
.swatch.sm{width:32px;height:32px;border-radius:16px}
/* свои цвета: «+» с радугой, правка палитры, колесо оттенков с ползунками насыщенности и яркости */
.swatch.add{background:conic-gradient(#FF4D4D,#FFD84D,#5BD18B,#2EC4E6,#4D6BFF,#C04DFF,#FF4D4D);display:flex;align-items:center;justify-content:center}
.swatch.add span{width:24px;height:24px;border-radius:12px;background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center}
.swatch.pal{outline:2px dashed var(--line2);outline-offset:3px}
.swb{position:relative;display:flex;flex:0 0 auto}
.swx{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:12px;background:var(--tx);color:#0E1014;border:2px solid var(--card);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0}
.cw{display:flex;align-items:center;gap:36px}
.cw-ring{position:relative;flex:0 0 auto;width:240px;height:240px;border-radius:50%;touch-action:none;cursor:pointer;
  background:conic-gradient(hsl(0,100%,50%),hsl(60,100%,50%),hsl(120,100%,50%),hsl(180,100%,50%),hsl(240,100%,50%),hsl(300,100%,50%),hsl(360,100%,50%))}
.cw-hole{position:absolute;top:40px;right:40px;bottom:40px;left:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;pointer-events:none}
.cw-prev{width:116px;height:116px;border-radius:58px;border:3px solid var(--line2)}
.cw-th{position:absolute;width:32px;height:32px;border-radius:16px;border:4px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.5);pointer-events:none}
.cw-sl{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;margin:0;outline:none;touch-action:none}
.cw-sl::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:16px;background:#fff;border:4px solid #0E1014;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.cw-sl::-moz-range-thumb{width:24px;height:24px;border-radius:12px;background:#fff;border:4px solid #0E1014}
/* подсказки — карточкой в стиле дека на месте визуализатора (его на это время не видно) */
#toast{position:absolute;left:300px;top:22px;width:420px;min-height:44px;display:flex;align-items:center;gap:10px;padding:6px 16px;background:var(--card2);color:var(--tx);border:1px solid var(--line2);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px;font-weight:700;line-height:1.3;opacity:0;transform:translateY(-10px) scale(.98);transition:opacity .25s,transform .25s;z-index:20;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.link{pointer-events:auto;cursor:pointer}
#toast .tdot{width:8px;height:8px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
#toast .tt{min-width:0;flex:1 1 auto;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
#toast .tgo{flex:0 0 auto;font-size:12px;color:var(--mu)}
.viz{transition:opacity .25s}
/* перетаскивание плиток в «Правке» и анимации переходов */
.cell.ghost > *{opacity:.25}
.cell.drop > .tile,.cell.drop > .mode-tile,.cell.drop > .plus{border:2px solid var(--tx)!important;transform:scale(1.03)}
.dragging{position:absolute;z-index:40;pointer-events:none;transform:scale(1.06);filter:drop-shadow(0 16px 26px rgba(0,0,0,.55));transition:transform .12s}
.dragging > .x,.dragging > .ed,.dragging > .au,.dragging > .au2{display:none}
@keyframes inUp{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes inDown{from{transform:translateY(-46px);opacity:0}to{transform:none;opacity:1}}
@keyframes inLeft{from{transform:translateX(70px);opacity:0}to{transform:none;opacity:1}}
@keyframes inRight{from{transform:translateX(-70px);opacity:0}to{transform:none;opacity:1}}
@keyframes inZoom{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.a-up{animation:inUp .28s cubic-bezier(.2,.8,.2,1)}.a-down{animation:inDown .28s cubic-bezier(.2,.8,.2,1)}
.a-left{animation:inLeft .26s cubic-bezier(.2,.8,.2,1)}.a-right{animation:inRight .26s cubic-bezier(.2,.8,.2,1)}
.a-zoom{animation:inZoom .22s ease-out}
#dock.editing{overflow-y:auto}
/* док не влез — листается пальцем, как лента; верх (статус и кнопки) остаётся на месте */
#dock{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none;overflow-anchor:none}   /* без «якоря»: блок растёт — лента не дёргается */
#dock::-webkit-scrollbar{display:none}
#dock > *{flex-shrink:0}
#dock > .dgap{flex-shrink:1}
#dock > .dtop{position:sticky;top:-18px;z-index:4;margin:-18px -16px 0;padding:18px 16px 10px;background:var(--dock)}
#dock.scrl > .dtop{box-shadow:0 10px 12px -10px rgba(0,0,0,.7)}
/* режим часов: часы приезжают из дока в центр, всё приглушено (от выгорания экрана) */
#saver{position:absolute;top:0;right:0;bottom:0;left:0;z-index:28;background:#000;opacity:0;transition:opacity .6s}
#saver.on{opacity:1}
#saver .sv{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;filter:brightness(.55);transition:transform 2s ease-in-out}
#saver .svc{display:flex;flex-direction:column;align-items:center;transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .4s}
#saver .svt{font-size:150px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--tx)}
#saver .svd{font-size:24px;font-weight:700;color:var(--mu);margin-top:10px}
#saver .svb{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:22px;font-weight:800;color:var(--tx2)}
#saver .svb:empty{display:none}
#saver .viz{flex:0 0 auto;width:640px;height:70px;margin:0}
#saver .svm{display:flex;align-items:center;gap:14px;max-width:640px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
#saver .svm .pp,#saver .svm .mbtn{width:52px;height:52px;flex:0 0 auto}
#saver.dark .sv{opacity:0;transition:opacity 1s}
#stage.toasting .viz{opacity:0}
/* правка дока: ширина и порядок блоков */
.dblk{position:relative;flex:0 0 auto}
.dblk[hidden]{display:none}
#dock.editing > *{flex-shrink:0}
#dock.editing .dgap{flex:0 0 auto}
.dblk.dedit{border:1px dashed var(--line2);border-radius:14px;padding:6px;min-height:40px}
.dbar{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--mu);letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px}
.dbar span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar button{width:26px;height:26px;padding:0;flex:0 0 auto;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-size:13px;color:var(--tx)}
.dbar button:disabled{opacity:.3}
.dgap{flex:1 1 auto;min-height:0}
.mic{width:34px;height:34px;align-items:center;justify-content:center}
/* блок дока своей высоты (cfg.dockH): содержимое — на всю высоту; в «Правке» — ручка на нижнем крае */
.dblk.sized{flex:0 0 auto;display:flex;flex-direction:column}
.dblk.sized > #stats,.dblk.sized > #clock,.dblk.sized > .pblk,.dblk.sized > #media{min-height:var(--h);flex:1 1 auto;flex-direction:column}
.dblk.sized > #clock,.dblk.sized > .pblk{display:flex}
.dblk.sized .pblk > .pwr{flex:1 1 auto}
.dblk.sized > #stats{justify-content:space-evenly}
#dock .dblk.sized .clk{flex:1 1 auto;height:auto;min-height:48px;container-type:inline-size;flex-direction:column;justify-content:center;gap:2px}
#dock .dblk.sized .clk b{font-size:clamp(23px,min(calc(var(--h) * .36),24cqw),72px)}
#dock .dblk.sized .clk .cd{text-align:center;font-size:clamp(11px,calc(var(--h) * .08),16px);line-height:1.25}
#dock .dblk.sized .pblk .lamp-na,#dock .dblk.sized .pblk .lsl{flex:1 1 auto;height:auto;min-height:40px}
.dblk.sized .spc{flex:1 1 auto;justify-content:space-between}
.dblk.sized .mrow{flex:1 1 auto;max-height:90px}
#dock .dblk.sized .mbtn{height:auto!important;min-height:40px}
.drz{position:absolute;left:0;right:0;bottom:-20px;height:40px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none;z-index:2}
.drz span{width:44px;height:6px;border-radius:3px;background:var(--line2);box-shadow:0 0 0 3px var(--dock)}
.dblk.rzing{border-color:var(--tx)}
.dblk.rzing .drz span{background:var(--tx)}
.btn.dk{flex:1 1 0;min-width:0;height:44px;padding:0;border-radius:13px}
.btn.dk svg{flex:0 0 auto}
.dbar button.on{background:var(--tx);color:#0E1014;border-color:var(--tx)}
.dgap.dedit{min-height:44px;display:flex;flex-direction:column}
.dw{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--tx2)}
.dw input{width:100%}
.ib{width:48px;height:48px;padding:0;border-radius:16px;background:var(--card);position:relative;flex:0 0 auto}
.ib .udot{position:absolute;top:9px;right:9px}
.fsec{font-size:12px;font-weight:800;color:var(--tx2);margin:10px 0 2px}
.swg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sw.swt{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px;min-height:74px;padding:10px 12px}
.swn{font-size:14px;font-weight:700;min-width:0;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.swh{font-size:12px;line-height:1.3;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sfield{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;min-width:0}
.sfield .gsel{width:100%}
.fsec:first-of-type{margin-top:0}
.zdot{width:14px;height:14px;border-radius:7px;flex:0 0 auto;border:1px solid rgba(255,255,255,.25)}
.vzprev{height:12px;border-radius:6px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-top:2px}
.sub{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#14171C}
.sub .gsel{height:36px;font-size:14px;width:100%}
#offline{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(8,9,12,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:30;font-size:18px;font-weight:700}
#offline.show{display:flex}
#pair{position:absolute;top:0;right:0;bottom:0;left:0;background:#0B0C10;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:31;padding:24px;text-align:center}
#pair.show{display:flex}
#pair input{width:260px;height:64px;border-radius:16px;border:1px solid var(--line);background:#14171D;color:var(--tx);font-size:34px;font-weight:800;letter-spacing:8px;text-align:center;outline:none}
/* dock */
.dm{flex:1 1 0;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:13px;font-weight:700}
.dm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .l{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.st .b{height:6px;border-radius:3px;background:#262B34;overflow:hidden;margin-top:5px}
.st .b div{height:6px;border-radius:3px;transition:width .6s}
.spc{display:flex;flex-direction:column;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px}
.mb{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative}
.pp{width:44px;height:44px;border-radius:22px;background:var(--tx);color:#0E1014;display:flex;align-items:center;justify-content:center}
.one{position:absolute;top:2px;right:1px;width:14px;height:14px;border-radius:7px;background:var(--sp);color:#0E1014;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* лампа */
.lamp{display:flex;gap:8px;height:44px}
.lp{width:44px;flex:0 0 44px;border-radius:14px;border:1px solid var(--line);background:#262B34;color:var(--mu);display:flex;align-items:center;justify-content:center}
.lp.on{background:rgba(255,181,71,.16);border-color:rgba(255,181,71,.55);color:#FFB547}
.lp:active{transform:scale(.96)}
.lsl{position:relative;flex:1 1 auto;min-width:0;border-radius:14px;background:#262B34;border:1px solid var(--line);overflow:hidden;touch-action:none}
.lsl .f{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,181,71,.18),rgba(255,181,71,.42));border-radius:0 6px 6px 0}
.lsl.off .f{background:rgba(255,255,255,.06)!important}
.lsl .t{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;font-weight:800;pointer-events:none}
.lsl .t b{font-family:"JetBrains Mono",Consolas,"Roboto Mono",monospace;color:var(--tx)}
.lsl.off .t b{color:var(--mu)}
/* саундпад */
#pgrid{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;min-height:0}
.snd{position:relative;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-width:0;min-height:0;overflow:hidden;transition:transform .08s}
.snd:active{transform:scale(.97)}
.snd .si{width:44px;height:44px;border-radius:22px;background:rgba(244,114,182,.14);color:#F472B6;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.snd .si svg{width:20px;height:20px}
.snd .sn{font-size:14px;font-weight:800;line-height:1.2;width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
.snd .sdur{position:absolute;top:8px;right:10px;font-size:11px;color:var(--mu)}
.snd.on{border-color:#F472B6;background:#2A1622}
.snd.on .si{background:#F472B6;color:#0E1014}
.snd.bad{opacity:.45}
.snd .pb{position:absolute;left:0;bottom:0;height:4px;width:0;background:#F472B6;animation-name:padprog;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes padprog{from{width:0}to{width:100%}}
.pad-empty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:var(--mu);font-size:15px;line-height:1.5}
.udot{width:8px;height:8px;border-radius:4px;background:var(--acc);flex:0 0 auto;box-shadow:0 0 0 3px rgba(77,163,255,.25)}
.chip{height:40px;border-radius:12px;border:1px solid var(--line);background:#14171C;padding:0 14px;font-size:13px;font-weight:700;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.on{background:#F472B6;border-color:#F472B6;color:#0E1014}
.meter{display:grid;grid-template-columns:130px minmax(0,1fr) 52px;align-items:center;gap:14px;font-size:13px;font-weight:700}
.meter .mtr{height:10px;border-radius:5px;background:#2E3440;overflow:hidden}
.meter .mtr div{height:10px;width:0;border-radius:5px;transition:width .12s linear}
/* часы в доке */
.clk{height:48px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px}
.clk b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.clk #clkC{transition:opacity .25s}
/* док не влез по высоте (часы + лампа + плеер + мониторинг) — всё чуть плотнее */
#dock.tight{gap:10px}
#dock.tight #stats{gap:6px!important}
#dock.tight > div:last-child{gap:8px!important}
#dock.tight .clk{height:40px}
#dock.tight .clk b{font-size:23px}
#dock.tight .lamp,#dock.tight .lamp-na{height:40px}
#dock.tight .spc{padding:6px!important;gap:4px!important}
#dock.tight .mbtn{height:40px!important}
#dock.tight .btn{height:40px}
.clk .cd{min-width:0;text-align:right;font-size:12px;line-height:15px;font-weight:700;color:var(--tx2)}
.clk .cd div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk .cd div:first-child{color:var(--mu)}
/* плагины: блок в доке, элементы, карточки в настройках */
.pblk{display:flex;flex-direction:column;gap:8px}
.pwr{display:flex;gap:8px;min-height:44px;align-items:stretch}
.pwr > .lsl{flex:1 1 auto}
.pwr > .btn{flex:1 1 0;min-width:0}
.pwr > .btn.wide{flex:4 1 0}                 /* в ряду широкая кнопка — главная, остальные (стрелка) узкие */
.pwb:disabled{opacity:.45;cursor:default}
.psl{min-height:44px}
.pwt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;min-width:0;flex:1 1 auto}
.pwt span{color:var(--mu);font-weight:700}
.pwt b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pwb{height:40px;font-size:13px}
.pwb.on{background:var(--tx);color:#0E1014}
.pwg{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;font-size:13px;font-weight:700;flex:1 1 auto}
.lamp-na.wide{width:100%}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* карты настроек и плагинов: шапка (значок, название, коротко что внутри, стрелка ▼ / ▲), тело раскрывается вниз */
.acc{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.acc.open{border-color:rgba(255,255,255,.16)}
.acch{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px 10px 14px;background:none;border:0;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.acci{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:var(--tx2)}
.acct{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.acct b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct small{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accv{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--tx)}
.acc.open .accv{color:var(--acc);border-color:var(--acc)}
.accb{display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.accb > .lbl:first-child, .accb > #updBox > .lbl:first-child{display:none}
.acclist{display:flex;flex-direction:column;gap:10px}
/* плагины: закрытая карта — плиткой по ширине названия (как языки), открытая — на всю ширину; настройки — списком */
.acclist.tiles{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.acclist.tiles > .acc{flex:0 0 auto;max-width:100%}
.acclist.tiles > .acc.open{flex:1 1 100%}
.acclist.tiles > .acc:not(.open) .acch{width:auto}
.acclist.tiles > .acc:not(.open) .acct small{width:0;min-width:100%}
.prow{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 10px 8px 14px}
.prow .acch{min-height:0;padding:0;flex:1 1 auto;min-width:0}
.prow .pdot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 auto}
.lgrid{display:flex;flex-wrap:wrap;gap:10px}
.ltile{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.ltile b{font-size:19px;font-weight:800;white-space:nowrap}
.ltile span{font-size:11.5px;color:var(--mu);white-space:nowrap}
.ltile.on{background:var(--acc);border-color:var(--acc)}
.ltile.on span{color:inherit;opacity:.75}
.ltile.get{border-style:dashed}
.ltile:disabled{opacity:.45;cursor:default}
.pbar{display:flex;flex-direction:column;gap:5px;min-width:0;flex:0 0 auto}
.pwr > .pbar,.pwr > .pstat,.pwr > .pcrd{flex:1 1 0}
.pbh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--p-mu,var(--mu));min-width:0}
.pbh svg{width:16px;height:16px;flex:0 0 auto}
.pbh b{margin-left:auto;color:var(--p-tx,var(--tx));font-weight:800;white-space:nowrap}
.pbt{position:relative;height:12px;border-radius:999px;background:var(--p-panel,#262A32);overflow:hidden;display:flex;
  box-shadow:inset 0 0 0 1px var(--p-border,transparent)}
.pbt > i{display:block;height:100%;flex:0 0 auto;transition:width .35s ease}
.pthm.px .pbt{border-radius:2px}
.pchart{display:flex;flex-direction:column;gap:6px;min-width:0}
.pchart .pcth{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--p-mu,var(--mu));text-transform:uppercase;letter-spacing:.03em}
.pchart .pcbox{position:relative;min-height:60px}
.pchart .pcbox svg{position:absolute;top:0;bottom:0;left:52px;right:0;width:calc(100% - 52px);height:100%;overflow:visible}
.pchart .pcy{position:absolute;left:0;width:48px;text-align:right;font-size:11px;font-weight:700;color:var(--p-mu,var(--mu));transform:translateY(-50%);white-space:nowrap}
.pchart .pcx{display:flex;justify-content:space-between;margin-left:52px;font-size:11px;font-weight:700;color:var(--p-mu,var(--mu))}
.pchart .pclg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700}
.pchart .pclg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pchart .pclg b{margin-left:6px;font-variant-numeric:tabular-nums}
.pstat{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 12px;border-radius:var(--p-r,14px);
  background:var(--p-panel,#191C22);border:1px solid var(--p-border,var(--line));flex:0 0 auto}
/* в доке тесно — плашки компактнее */
.pblk .pstat{padding:8px;gap:6px}
.pblk .pstat > svg,.pblk .pstat > .pic{width:18px;height:18px;font-size:16px;line-height:18px}
.pblk .pstat b{font-size:15px}
.pblk .pstat span{font-size:10px}
.pic{display:inline-block;flex:0 0 auto;width:1.25em;height:1.25em;line-height:1.25em;text-align:center;object-fit:contain}
.pstat > svg,.pstat > .pic{width:26px;height:26px;flex:0 0 auto;color:var(--c,var(--p-acc,var(--tx2)))}
.pstat > .pic{font-size:22px;line-height:26px}
.pbh .pic{font-size:14px}
.pch .pic{font-size:17px}
.pstat b{display:block;font-size:20px;font-weight:800;line-height:1.1;color:var(--c,var(--p-tx,var(--tx)));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstat span{display:block;font-size:11px;font-weight:700;color:var(--p-mu,var(--mu));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstat small{display:block;font-size:11px;color:var(--p-mu,var(--mu))}
.plbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--p-mu,var(--mu))}
.pgrd{display:grid;gap:8px;min-width:0}
.pcrd{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;border-radius:var(--p-r,14px);min-width:0;
  background:var(--p-panel,#191C22);border:1px solid var(--p-border,var(--line))}
.pch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--p-acc,var(--tx))}
.pcrd > *,.pscr > *{flex:0 0 auto}
.pcrd > .pgrd.fill{flex:1 1 auto;min-height:0;height:auto}     /* сетка во всю оставшуюся высоту карточки */
.pch svg{width:18px;height:18px}
/* режим плагина (вместо сетки плиток) и то, что для него нужно: нажимаемые шкалы / плашки / карточки, колонки
   своей ширины на всю высоту, своя прокрутка, кукла из фигур, списки выбора, поле для скрипта */
.pperm{display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--tx2);background:rgba(255,255,255,.03)}
.pperm.hi{border-color:rgba(255,142,138,.55);color:#FFB3AF}
.pperm.no{opacity:.55;border-style:dashed}
.ktag{display:inline-block;vertical-align:2px;margin-right:7px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1;padding:4px 7px;border-radius:6px}
.ktag.plugin{color:#7CC0FF;background:rgba(77,163,255,.14);border:1px solid rgba(77,163,255,.45)}
.ktag.mod{color:#D3A6FF;background:rgba(176,124,255,.14);border:1px solid rgba(176,124,255,.45)}
.ltag{display:inline-block;vertical-align:2px;margin-left:7px;font-size:10px;font-weight:800;letter-spacing:.04em;line-height:1;padding:4px 6px;border-radius:6px;color:var(--mu);border:1px solid var(--line)}
.ltag.no{color:#F2B84B;border-color:rgba(242,184,75,.5)}
.pperm.api{color:var(--mu)}
.pask{display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:14px;border:1px solid rgba(242,184,75,.45);background:rgba(242,184,75,.06)}
.pmode{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;border-radius:var(--p-r,16px);padding:10px}
/* живая картинка плагина (элемент stream, MJPEG с /stream/<id>): касания уходят на ПК, щипок — дека */
.pmode > .pstream{flex:1 1 auto}
.pstream{position:relative;min-height:120px;background:#000;border-radius:var(--p-r,12px);overflow:hidden;touch-action:none;
  display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
.pstream canvas{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.pstream .psw{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#8B93A1;font-weight:700;font-size:15px;padding:0 20px}
.pstream.live .psw{display:none}
/* поток «на весь экран» (full): без шапки, дока и стрелки — только картинка; выход — щипок */
#stage.pfull #dock,#stage.pfull #trayBtn{display:none}
#stage.pfull #main{padding:0;gap:0}
#stage.pfull .pmode{padding:0;border-radius:0}
#stage.pfull .pstream{border-radius:0}
.pmode.bgd{background:var(--p-bg,transparent)}
.pmode > *{flex:0 0 auto}
.pmode > .pgrd.fill{flex:1 1 auto}
.pgrd.fill{min-height:0;align-items:stretch;height:100%}
.pgrd.fill > *{min-height:0}
.pscrl{overflow-y:auto;touch-action:pan-y;min-height:0}
.pclk{cursor:pointer;transition:transform .08s,border-color .15s,box-shadow .15s}
.pclk:active{transform:scale(.98)}
.pbar.pclk,.pbar.pon{padding:8px 10px;border-radius:var(--p-r,14px);border:1px solid var(--p-border,var(--line));background:var(--p-panel,#191C22)}
.pclk.pon{border-color:var(--p-acc,var(--tx));box-shadow:0 0 0 1px var(--p-acc,var(--tx)) inset}
.pshv{display:block;width:100%;height:100%;max-height:100%}
.pcrd > .pshv.fill{flex:1 1 0;min-height:140px;height:auto}     /* кукла во всю оставшуюся высоту карточки */
.pttl{font-size:16px;font-weight:800;line-height:1.25;color:var(--p-tx,var(--tx));overflow-wrap:anywhere}
.pln.pb{font-weight:700}
.pwr > .pimg{flex:0 0 auto;align-self:center}
.pln{font-size:13px;line-height:1.35;color:var(--p-tx,var(--tx2));overflow-wrap:anywhere}
.pshp{cursor:pointer}.pshp:active{opacity:.85}
.psel{display:flex;align-items:center;gap:8px;min-width:0}
.psel span{font-size:12px;font-weight:700;color:var(--p-mu,var(--mu));flex:0 0 auto}
.psel select{flex:1 1 auto;min-width:0}
.pta{display:flex;flex-direction:column;gap:6px;min-width:0}
.pta textarea{width:100%;resize:none;border-radius:var(--p-r,12px);border:1px solid var(--p-border,var(--line));background:#14171C;color:var(--p-tx,var(--tx));
  padding:8px 10px;font:14px/1.4 "JetBrains Mono",Consolas,"Roboto Mono",monospace;outline:none;user-select:text;-webkit-user-select:text;touch-action:auto}
.pta .row{justify-content:space-between;gap:8px}
.pimg{display:block;max-width:100%;object-fit:contain;border-radius:calc(var(--p-r,14px) / 2)}
.pimg.px,.pthm.px .pimg{image-rendering:pixelated;border-radius:0}
/* свой вид плагина (theme): фон, панели, рамки, текст, акцент, скругление, шрифт, текстура */
.pthm{color:var(--p-tx,inherit);font-family:var(--p-font,inherit);font-weight:var(--p-w,inherit)}
.pthm.bgd{background-color:var(--p-bg);background-image:var(--p-tex,none);border-radius:var(--p-r,14px);padding:10px;
  border:1px solid var(--p-border,transparent)}
.pthm.px{background-size:auto;image-rendering:pixelated}
.pthm .pwb{background:var(--p-panel,var(--card));border:1px solid var(--p-border,var(--line));color:var(--p-tx,var(--tx));border-radius:var(--p-r,12px)}
.pthm .pwb.on{background:var(--p-acc,var(--tx));color:var(--p-bg,#0E1014)}
.pthm .pwt b{color:var(--p-tx,var(--tx))}
.pthm .pwt span{color:var(--p-mu,var(--mu))}
.pscr{display:flex;flex-direction:column;gap:12px}
.pin input{flex:1 1 auto;min-width:0;height:40px;border-radius:var(--p-r,12px);border:1px solid var(--p-border,var(--line2));
  background:var(--p-panel,var(--card));color:var(--p-tx,var(--tx));font:inherit;font-size:14px;padding:0 12px}
.pcard{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;background:#14171C;padding:10px 12px}
.pcard.dim{opacity:.55}
.pset{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.lamp-na{width:100%;height:44px;border-radius:14px;border:1px dashed var(--line2);color:var(--mu);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:700;padding:0 10px}
/* сетка режима — любая от 4×2 до 8×4 (окно режима); мелкие плитки — dense, средние — mid */
#grid.dense{gap:8px}
#grid.dense .tile,#grid.dense .tile.edit,#grid.dense .tile.sel{padding:8px 4px;gap:5px;border-radius:14px;justify-content:center}
#grid.dense .tile .ic{width:42px;height:42px;border-radius:12px;font-size:14px}
#grid.dense .tile .ic img{top:5px;right:5px;bottom:5px;left:5px;width:32px;height:32px}
#grid.dense .tile .ic svg{width:24px;height:24px}
#grid.dense .tile .nm{font-size:12px;-webkit-line-clamp:1}
#grid.dense .tile .sb{font-size:10px;margin-top:1px}
#grid.dense .tile .gic{grid-template-columns:repeat(2,18px);grid-auto-rows:18px;gap:3px}
#grid.dense .tile .gi{border-radius:5px;font-size:8px}
#grid.dense .tile .gi img{top:2px;right:2px;bottom:2px;left:2px;width:14px;height:14px}
#grid.dense .plus{border-radius:14px}
#grid.dense .plus svg{width:26px;height:26px}
#grid.dense .x,#grid.dense .ed{width:28px;height:28px;top:-8px;border-width:2px}
#grid.dense .x{right:-8px}#grid.dense .ed{left:-8px}
#grid.dense .au{height:22px;bottom:4px;font-size:10px;padding:0 6px 0 4px;gap:3px}
#grid.dense .au svg{width:12px;height:12px}
#grid.dense .au2{height:22px;bottom:4px;right:4px;font-size:10px;padding:0 6px}
#grid.mid{gap:10px}
#grid.mid .tile,#grid.mid .tile.edit,#grid.mid .tile.sel{padding:12px 8px 10px;gap:8px;border-radius:18px;justify-content:center}
#grid.mid .tile .ic{width:64px;height:64px;border-radius:18px;font-size:20px}
#grid.mid .tile .ic img{top:8px;right:8px;bottom:8px;left:8px;width:48px;height:48px}
#grid.mid .tile .ic svg{width:34px;height:34px}
#grid.mid .tile .nm{font-size:14px;-webkit-line-clamp:1}
#grid.mid .tile .gic{grid-template-columns:repeat(2,26px);grid-auto-rows:26px;gap:4px}
#grid.mid .tile .gi img{top:2px;right:2px;bottom:2px;left:2px;width:22px;height:22px}
#grid.mid .x,#grid.mid .ed{width:32px;height:32px;top:-9px}
#grid.mid .au{height:28px;bottom:6px;font-size:11px}
#grid.mid .au2{height:28px;bottom:6px;right:6px;font-size:11px;padding:0 8px}
.gsel{height:40px;border-radius:12px;border:1px solid var(--line);background:#14171C;color:var(--tx);padding:0 10px;font:inherit;font-size:15px;font-weight:700;outline:none}
/* выпадающие списки в стиле дека: вместо системного окна выбора — своя кнопка и всплывающий список */
.xsel{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;max-width:100%}
.xsel .xv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xsel svg{flex:0 0 auto;color:var(--mu);transition:transform .18s}
.xsel.open{border-color:var(--tx2)}
.xsel.open svg{transform:rotate(180deg)}
#xpopBg{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60}
.xpop{position:absolute;z-index:61;background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:2px;
  overflow-y:auto;box-shadow:0 18px 40px rgba(0,0,0,.55);transform-origin:top center;animation:xpopIn .14s ease-out;touch-action:pan-y}
.xpop.up{transform-origin:bottom center}
@keyframes xpopIn{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.xpop .xo{min-height:44px;border-radius:11px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:700;color:var(--tx2);text-align:left;flex:0 0 auto}
.xpop .xo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xpop .xo:active{background:#2E343F}
.xpop .xo.on{background:#14171C;color:var(--tx)}
.xpop .xo svg{flex:0 0 auto;color:var(--acc)}
.ed{position:absolute;top:-10px;left:-10px;width:36px;height:36px;border-radius:18px;border:3px solid #0E1014;background:var(--tx);color:#0E1014;display:flex;align-items:center;justify-content:center}
.hkbar{position:relative;min-height:36px;margin-right:46px}   /* справа — стрелка дока */
.hkbar .side{position:absolute;left:0;top:0}.hkbar .side.r{left:auto;right:0}
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.seg button{height:28px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:800;color:var(--mu)}
.seg button.on{background:var(--tx);color:#0E1014}
.kb{flex:1 1 auto;display:grid;gap:8px;min-height:0}
.key{position:relative;min-width:0;min-height:0;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:transform .06s}
.key.sm{font-size:14px}
.key:active{transform:scale(.95);background:var(--card2)}
.key .alt{position:absolute;top:5px;right:8px;font-size:12px;font-weight:700;color:var(--mu)}
.kc{height:36px;min-width:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:#14171C;font-size:13px;font-weight:800}
.kc.on{background:var(--tx);color:#0E1014;border-color:var(--tx)}
/* редактор скрипта: блоки — шаг карточкой (то же, что строка текста) */
.scb{flex:1 1 auto;min-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;touch-action:pan-y}
.scc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;background:#14171C;padding:7px 8px 7px 10px;min-height:52px}
.scc.sel{border-color:var(--line2);background:#181C22}
.scc.err{border-color:#FF8E8A}
.scc.run{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.scc .scn{flex:0 0 22px;font-size:11px;font-weight:800;color:var(--mu);text-align:center}
.scc .sck{flex:0 0 118px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--tx2);min-width:0}
.scc .sck svg{width:18px;height:18px;flex:0 0 auto}
.scc .scf{flex:1 1 auto;display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.scc .scf .sc-in{height:36px;font-size:14px;min-width:0}
.scc .sca{flex:0 0 auto;display:flex;gap:4px}
.scc .sca button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);color:var(--tx2);font-size:14px;font-weight:800}
.scc .sce{flex:1 0 100%;font-size:11.5px;color:#FF8E8A;margin-top:2px}
.sctab{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.sctab button{height:36px;padding:0 14px;font-weight:800;font-size:13px;color:var(--tx2)}
.sctab button.on{background:var(--tx);color:#0E1014}
/* редактор скрипта */
.sc-ta{flex:1 1 auto;min-height:150px;width:100%;resize:none;border-radius:14px;border:1px solid var(--line);background:#14171C;color:var(--tx);padding:10px 12px;font:15px/1.45 "JetBrains Mono",Consolas,"Roboto Mono",monospace;outline:none;user-select:text;-webkit-user-select:text;touch-action:auto}
.sc-in{height:40px;border-radius:12px;border:1px solid var(--line);background:#14171C;color:var(--tx);padding:0 12px;font:inherit;font-size:15px;outline:none;user-select:text;-webkit-user-select:text}

// Отдельным скриптом и по-старому (ES5): ловит и ошибку разбора основного скрипта.
window.__errs = [];
window.addEventListener('error', function (e) {
  var m = (e && e.message) || 'error', at = e && e.lineno ? ' @' + e.lineno + ':' + (e.colno || 0) : '';
  if (window.__errs.length < 30) window.__errs.push(String(m).slice(0, 300) + at);
  if (window.__errFlush) window.__errFlush();
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason; if (window.__errs.length < 30) window.__errs.push('promise: ' + String((r && (r.stack || r.message)) || r).slice(0, 300));
  if (window.__errFlush) window.__errFlush();
});
</script>

    case 'plugins': pluginsIn(m); break;
    case 'catalog': S.catalog = m; if (S.settings) ovRefresh(); break;
    case 'langs': S.langs = m; S.langsWait = false; packLoad(); if (S.settings) ovRefresh(); break;
    case 'mods': modsIn(m); break;
    case 'lookSaved': if (S.look && S.look.saving){ S.look = null; lookPanel(); lyEdRender(); modsApply(); renderView(); toast(T('Look saved and turned on', 'Вигляд збережено й увімкнено')); } break;
    case 'running':
      S.running = new Set(m.procs);
      for (const key of Object.keys(S.ctxOn)) if (!S.running.has(key.split('|')[0])) delete S.ctxOn[key];   // закрылась — забыть
      if (S.view && !S.pad) renderView(); break;
    case 'padList': S.padList = m; if (S.pad) renderView(); if (S.padCfg) renderOverlay(); break;
    case 'padState': padIn(m); break;
    case 'padMeter': padMeterIn(m); break;
    case 'viz': vizIn(m.b || ''); break;
    case 'events': S.events = m.items || []; S.evRead = m.read || 0; S.unread = m.unread || 0; bellDock(); if (S.center) renderOverlay(); break;
    case 'event': S.events.push(m.ev); if (S.events.length > 200) S.events.shift(); S.unread = m.unread || 0; bellDock();
      if (S.center){ if (m.ev.notify) markRead(); keepBody(renderOverlay); } break;
    case 'eventsRead': S.evRead = m.read; S.unread = m.unread; bellDock(); break;
    case 'diag': S.diagData = m; if (S.diag && S.diagTab !== 'deck') keepBody(renderOverlay); break;
    case 'health': S.healthData = m; if (S.diag && S.diagTab === 'deck') keepBody(renderOverlay); break;
    case 'healthReport': S.report = m; if (S.diag) keepBody(renderOverlay); toast(T('Report ready: ', 'Звіт готовий: ') + m.name); break;
    case 'clip': S.clip = m.items || []; if (S.clipWin) keepBody(renderOverlay); break;
    case 'devices': S.devData = m; if (S.devWin) keepBody(renderOverlay); break;
    case 'wlWins': if (S.wl){ S.wl.wins = m.wins || []; S.wl.sel = Object.fromEntries(S.wl.wins.map((w, i) => [i, !S.wl.only || S.wl.only.includes(w.proc)])); renderOverlay(); } break;
    case 'toast': toast(m.text, m.force ? {force:true, ms:m.ms} : {}); break;
    case 'scriptInfo': if (S.sc && m.seq === S.sc.seq){ S.sc.info = m; scStatus(); } break;
    case 'changelog': S.changelog = m.items || []; if (S.settings && S.setPage === 'changes') ovRefresh(); break;
    case 'upd':
      S.upd = m; if (S.settings) ovRefresh(); if (isHome() && !S.pad) renderView();
      if (m.state === 'ahead' && m.remote && S.updHint !== m.remote.sha && !m.busy){
        S.updHint = m.remote.sha;
        setTimeout(() => toast(T('Deck update available: ', 'Доступне оновлення дека: ') + m.remote.msg, {ms:7000, act:'settings', color:'var(--acc)', force:true}), 600);
      }
      break;
    case 'apps': if (S.rulePick){ S.rulePick.list = m.list; S.rulePick.loading = false; renderOverlay(); }
      if (S.picker){ S.picker.list = m.list; S.picker.loading = false; renderPickList(); } break;
  }
}

// ---------- тема ----------
function applyTheme(){
  const b = BGS[S.cfg.bg] || BGS.graphite;
  document.documentElement.style.setProperty('--dockW', dockW() + 'px');
  document.documentElement.style.setProperty('--bg', b.main);
  document.documentElement.style.setProperty('--dock', b.dock);
  document.querySelector('meta[name=theme-color]').content = b.main;
  applyLang();
}
function applyLang(){
  document.documentElement.lang = LANG();
  packLoad();
  $('#offT').textContent = T('No connection to the PC', 'Немає зв’язку з ПК');
  $('#offS').textContent = T('Reconnecting… Check that the deck is running on the PC (icon near the clock)', 'Перепідключаюся… Перевір, що дек запущено на ПК (значок біля годинника)');
  wolShow();
  try { localStorage.setItem('deckLang', LANG()); } catch (e) {}
  try { if (APP && typeof APP.setLang === 'function') APP.setLang(LANG()); } catch (e) {}   // экран подключения в приложении
}

// ---------- главный экран / режим ----------
function renderView(){
  dkSync();
  $('#stage').classList.remove('pfull');
  const LY = !S.pad && isHome() && !S.edit ? lyActive() : null;
  $('#stage').classList.toggle('lynodock', !!(LY && !LY.dock));
  if (!LY && S.lyMounted){ S.lyMounted = false; setTimeout(renderDock, 0); }   // ушли с компоновки — блоки дока назад в док
  if (S.pad){ renderPad(); return; }
  const v = $('#view');
  if (isHome()){
    if (!S.edit && DeckAPI._home){ try { if (DeckAPI._home(v) !== false){ modEmit('render:home', v); return; } } catch (e){ modErr(e); } }
    if (LY){ renderLayout(v, LY); return; }
    renderHome(v); modEmit('render:home', v); return; }
  const hk = isHK(), kb = hk && S.cfg.hkView === 'keyboard' && !S.edit;
  // заголовок режима: удержание — настройки режима
  const head = (extra, right) => `
    <div class="mh">
      <div class="row" style="gap:12px;min-width:0"><div class="row mic" data-hold="${S.view}" title="${esc(modeName(S.view))}" aria-label="${esc(modeName(S.view))}" style="flex:0 0 auto">${modeIcon(curMode(), 26)}</div>${extra}</div>
      ${vizHtml()}${miniHtml()}${right}
    </div>`;
  if (curMode().plugin){
    // поток на весь экран (второй монитор и т. п.): только он, без шапки и дока
    if (pFull(curMode().plugin)){ $('#stage').classList.add('pfull'); psKeep(v, () => { v.innerHTML = pmHtml(curMode().plugin); }); return; }
    v.innerHTML = head('', '') + pmHtml(curMode().plugin); vizKick(); miniRun($('#hmini')); return;
  }
  if (kb){
    const mods = S.cfg.hkKb === 'numpad'
      ? `<div class="row" style="gap:6px">${KB_MODS.map(m => kbKey(m, keyLabel(m), 'height:34px;padding:0 12px;flex:0 0 auto')).join('')}</div>` : '';

    vizKick(); miniRun($('#hmini'));
    return;
  }
  const [cols, rows] = gridOf(S.view), per = cols * rows;
  const list = S.layouts[S.view] || [];
  // плитки выключенного или удалённого плагина не показываем (в раскладке остаются — вернутся с плагином)
  const vis = list.map((_, k) => k).filter(k => list[k].kind !== 'plugin' || !!plgTile(list[k]));
  const total = vis.length + 1;
  const pages = Math.max(1, Math.ceil(total / per));
  S.page = Math.min(S.page, pages - 1);
  let tiles = '';
  for (let q = S.page * per; q < Math.min(total, (S.page + 1) * per); q++){
    const k = q === vis.length ? list.length : vis[q];
    if (q === vis.length){ if (S.role.role === 'main') tiles += `<div class="cell"><button class="plus" data-act="add" aria-label="${hk ? T('Add a hotkey', 'Додати хоткей') : T('Add apps', 'Додати програми')}">${I.plus}</button></div>`; continue; }
    const it = list[k], pt = it.kind === 'plugin' ? plgTile(it) : null;
    const isMic = it.kind === 'toggle' && it.action === 'mic';
    const on = (it.kind === 'toggle' && (isMic ? !!S.audio.micMuted : !!S.toggles[it.label])) || !!(pt && pt.on);
    const isGroup = it.kind === 'group';
    const isHot = (it.kind === 'macro' || it.kind === 'toggle') && it.action === 'hotkey' && !!it.keys;
    const isScript = it.kind === 'macro' && it.action === 'script', sRun = isScript && S.scripts.includes(it.id);
    const mem = isGroup ? (it.items || []) : [];
    const missing = it.kind === 'app' && !it.path;
    let sub = missing ? T('Nothing found', 'Не знайдено') : (it.auto ? T('Autostart', 'Автозапуск') : KIND_SUB()[it.kind]);
    if (it.kind === 'macro' && isHot) sub = esc(comboLabel(it.keys));
    if (it.kind === 'macro' && it.action === 'winlayout') sub = T('Window layout', 'Розкладка вікон');
    if (isScript) sub = sRun ? (S.steps && S.steps[it.id] ? T('Step ', 'Крок ') + S.steps[it.id] + T(' · tap to stop', ' · стоп — натисни') : T('Running · tap to stop', 'Іде · натисни — стоп'))
      : it.loop ? T('Script · looping', 'Скрипт · по колу') : T('Script', 'Скрипт') + (it.repeat > 1 ? ` · ×${it.repeat}` : '');
    if (it.kind === 'toggle') sub = isMic ? (on ? T('Off', 'Вимкнено') : T('On', 'Увімкнено')) : (on ? T('On', 'Увімкнено') : T('Off', 'Вимкнено'));
    if (pt) sub = esc(pt.sub || pt.pname);
    const runN = mem.filter(x => x.proc && S.running.has(x.proc)).length;
    if (isGroup) sub = (it.auto ? T('Auto · ', 'Авто · ') : T('Group · ', 'Група · ')) + (runN ? `${runN}/${mem.length} ${T('running', 'запущено')}` : `${mem.length} ${T('apps', 'прогр.')}`);
    const running = (it.kind === 'app' && it.proc && S.running.has(it.proc)) || runN > 0;
    const ctx = it.kind === 'app' && running && !S.edit && gridCls(cols, rows) !== 'dense' ? ctxOf(it).slice(0, 3) : [];
    let cls = 'tile' + (ctx.length ? ' hasctx' : ''), style = '';
    if (S.edit) cls += S.sel === k ? ' sel' : ' edit';
    else if (on || sRun) style = `border-color:${isMic ? 'var(--red)' : acc(S.view)};background:${isMic ? '#2A1517' : 'var(--card2)'}`;
    if (missing) cls += ' dim';
    const icStyle = on || sRun ? `background:${isMic ? 'var(--red)' : acc(S.view)};color:${isMic ? '#0E1014' : ink(acc(S.view))}` : '';
    // в мелкой сетке хоткеев на значке — сама клавиша, сочетание целиком — подписью
    const glyph = pt ? icnOf(pt.icon, 28) : isGroup || it.path || (hk && isHot) ? '' : glyphOf(it, isMic && on);
    const mono = pt ? (pt.icon && !icnOf(pt.icon) ? pt.icon : monoOf({label:pt.label})) : hk && isHot && !it.mono ? keyLabel(lastKey(it.keys)) : monoOf(it);
    const icon = isGroup
      ? `<div class="ic gic" style="color:${acc(S.view)}">${mem.slice(0, 4).map(x => `<div class="gi mono-f">${esc(monoOf(x))}${x.path ? `<img src="${iconUrl(x.path)}" alt="" onerror="this.remove()">` : ''}</div>`).join('')}</div>`
      : `<div class="ic mono-f" style="color:${acc(S.view)};${icStyle}">${glyph || esc(mono)}${it.path && !on ? `<img src="${iconUrl(it.path)}" alt="" onerror="this.remove()">` : ''}</div>`;
    const canAuto = it.kind === 'app' || isGroup;
    tiles += `<div class="cell">
      <button class="${cls}" style="${style}" data-act="tile" data-k="${k}" aria-label="${esc(it.label)}">
        ${icon}
        <div class="tx"><div class="nm">${esc(pt ? pt.label : lblOf(it))}</div>
        <div class="sb" style="${on && isMic ? 'color:#FF8E8A' : ''}">${running ? '<span class="run"></span>' : ''}${sub}</div></div>
      </button>
      ${S.edit ? `<button class="x" data-act="del" data-k="${k}" aria-label="${T('Delete', 'Видалити')} ${esc(it.label)}">${I.x}</button>` : ''}
      ${S.edit && (isHot || isScript) ? `<button class="ed" data-act="${isScript ? 'scEdit' : 'hkEdit'}" data-k="${k}" aria-label="${T('Edit', 'Змінити')} ${esc(it.label)}">${I.pen}</button>` : ''}
      ${S.edit && it.kind === 'macro' && it.action === 'winlayout' ? `<button class="ed" data-act="wlEdit" data-k="${k}" aria-label="${T('Remember the layout again', 'Запам’ятати розкладку заново')}">${I.pen}</button>` : ''}
      ${S.edit && it.kind === 'app' ? `<button class="ed" data-act="ctxEdit" data-k="${k}" aria-label="${T('App actions', 'Дії програми')} ${esc(it.label)}">${I.pen}</button>` : ''}
      ${ctx.length ? `<div class="ctxbar">${ctx.map((a, n) => { const on = a.plg ? a.pon : a.toggle && S.ctxOn[ctxKey(it, n)];
        return `<button class="cx" data-act="ctx" data-k="${k}" data-n="${n}"${a.toggle ? ` aria-pressed="${!!on}"` : ''} style="${on ? `background:${acc(S.view)};border-color:${acc(S.view)};color:${ink(acc(S.view))}` : ''}">${esc(a.label)}</button>`; }).join('')}</div>` : ''}
      ${S.edit && canAuto ? `<button class="au${isGroup ? ' l' : ''}" data-act="auto" data-k="${k}" role="switch" aria-checked="${!!it.auto}" aria-label="${T('Autostart', 'Автозапуск')} ${esc(it.label)}"
        style="background:${it.auto ? acc(S.view) : '#262B34'};color:${it.auto ? ink(acc(S.view)) : 'var(--mu)'}">${I.power}${it.auto ? T('Auto', 'Авто') : T('Auto off', 'Авто вимк')}</button>` : ''}
      ${S.edit && isGroup ? `<button class="au2" data-act="grpEdit" data-k="${k}" aria-label="${T('Group contents', 'Склад групи')} ${esc(it.label)}">${T('Contents', 'Склад')}</button>` : ''}
    </div>`;
  }
  const dots = Array.from({length:pages}, (_, i) =>
    `<button class="pd" data-act="page" data-i="${i}" aria-label="${T('Page', 'Сторінка')} ${i+1}" style="width:${i===S.page?28:10}px;background:${i===S.page?acc(S.view):'#3A404C'}"></button>`).join('');
  const nav = `<button class="pg" data-act="prev" aria-label="${T('Back', 'Назад')}">${I.left}</button>${dots}<button class="pg" data-act="next" aria-label="${T('Forward', 'Вперед')}">${I.right}</button>`;
  v.innerHTML = `
    ${head('',
      S.edit ? `<div class="pill">${hk
        ? T('Edit: drag a tile to move it · pencil — change the combo', 'Редагування: перетягни плитку — переставити · олівець — змінити сполучення')
        : T('Edit: drag a tile to move it · «Auto» — autostart · «Contents» — group', 'Редагування: перетягни плитку — переставити · «Авто» — автозапуск · «Склад» — група')}</div>` : '')}
    <div id="grid" class="${gridCls(cols, rows)}" style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr))">${tiles}</div>
    ${hk ? `<div class="pager hkbar"><div class="side">${hkViewSeg()}</div>${nav}</div>` : `<div class="pager">${nav}</div>`}`;
  vizKick(); miniRun($('#hmini'));
}

      ${ed && S.delAsk === m.id ? `<div class="ask">

// ---------- хоткеи: клавиатура ----------
const KB_MODS = ['ctrl', 'shift', 'alt', 'super'];
// правая половина клавиатуры (от Y, H, N до \): [клавиша, подпись, ширина в клавишах]
const KB_KEYS = [
  [['6'], ['7'], ['8'], ['9'], ['0'], ['-'], ['='], ['backspace', 'Backspace', 1.5]],
  [['y'], ['u'], ['i'], ['o'], ['p'], ['['], [']'], ['\\', '\\', 1.5]],
  [['h'], ['j'], ['k'], ['l'], [';'], ["'"], ['enter', 'Enter', 2.5]],
  [['n'], ['m'], [','], ['.'], ['/'], ['shift', 'Shift', 3.5]],
  [['ctrl', 'Ctrl', 1.5], ['super'], ['alt', 'Alt', 1.5], ['space', 'Space', 3.5], ['esc', 'Esc']],
];
// цифровой блок и стрелки рядом, как на клавиатуре: [клавиша, подпись, столбец, строка, ширина, высота]
const KB_NUM = [
  ['numlock', 'Num', 1, 1], ['kpslash', '/', 2, 1], ['kpasterisk', '*', 3, 1], ['kpminus', '−', 4, 1],
  ['kp7', '7', 1, 2], ['kp8', '8', 2, 2], ['kp9', '9', 3, 2], ['kpplus', '+', 4, 2, 1, 2],
  ['kp4', '4', 1, 3], ['kp5', '5', 2, 3], ['kp6', '6', 3, 3],
  ['kp1', '1', 1, 4], ['kp2', '2', 2, 4], ['kp3', '3', 3, 4], ['kpenter', 'Enter', 4, 4, 1, 2],
  ['kp0', '0', 1, 5, 2], ['kpdot', '.', 3, 5],
  ['insert', 'Ins', 6, 1], ['home', 'Home', 7, 1], ['pgup', 'PgUp', 8, 1],
  ['delete', 'Del', 6, 2], ['end', 'End', 7, 2], ['pgdn', 'PgDn', 8, 2],
  ['up', '↑', 7, 4], ['left', '←', 6, 5], ['down', '↓', 7, 5], ['right', '→', 8, 5],
];
// кириллица на клавишах — подсказкой в углу
// украинская раскладка на тех же клавишах — подсказка только на украинском (на остальных языках её нет)
const kbCyr = () => UK() ? {y:'Н', u:'Г', i:'Ш', o:'Щ', p:'З', '[':'Х', ']':'Ї', h:'Р', j:'О', k:'Л', l:'Д', ';':'Ж', "'":'Є', n:'Т', m:'Ь', ',':'Б', '.':'Ю'} : {};
function kbKey(k, label, style){
  const on = KB_MODS.includes(k) && !!S.kbMods[k];
  const lab = label || keyLabel(k), cyr = kbCyr()[k];
  return `<button class="key${lab.length > 2 ? ' sm' : ''}" data-act="key" data-k="${esc(k)}"${KB_MODS.includes(k) ? ` aria-pressed="${on}"` : ''}
    style="${style}${on ? `;background:${acc(S.view)};border-color:${acc(S.view)};color:${ink(acc(S.view))}` : ''}">${esc(lab)}${cyr ? `<span class="alt">${cyr}</span>` : ''}</button>`;
}
function kbBody(){
  if (S.cfg.hkKb === 'numpad')

// молния зарядки: где заряд уже залил батарейку — тёмная, где ещё пусто — белая (иначе чёрное на чёрном)
function battBolt(edge, id = ''){
  const bolt = 'M14 2.2L8.6 7.6h3.6l-1.6 4.2 5.6-5.6h-3.6z', e = edge.toFixed(1);
  return `<defs><clipPath id="bcF${id}"><rect x="0" y="0" width="${e}" height="14"/></clipPath><clipPath id="bcE${id}"><rect x="${e}" y="0" width="26" height="14"/></clipPath></defs>
    <path d="${bolt}" fill="#0E1014" clip-path="url(#bcF${id})"/><path d="${bolt}" fill="#fff" stroke="#0E1014" stroke-width=".6" clip-path="url(#bcE${id})"/>`;
}
// батарейка телефона: w — ширина в px (в доке 24, на экране часов крупнее); id — свои clipPath для молнии
function battSvg(b, w, id){
  return `<svg width="${w}" height="${Math.round(w * 14 / 24)}" viewBox="0 0 26 14" fill="none"><rect x="1" y="1" width="21" height="12" rx="3" stroke="currentColor" stroke-width="1.6"/><rect x="23.2" y="4.5" width="2" height="5" rx="1" fill="currentColor"/><rect x="3" y="3" width="${(17.5*b.level).toFixed(1)}" height="8" rx="1.5" fill="${b.level < .2 && !b.charging ? 'var(--red)' : 'var(--green)'}"/>${b.charging ? battBolt(3 + 17.5 * b.level, id === 'd' ? '' : id) : ''}</svg>`;
}

// блоки дока: порядок — cfg.dockOrder (в «Правке» — стрелками), gap — пустое место, которое растягивается
const DOCK_IDS = ['stats', 'gap', 'clock', 'media'];
const dockW = () => Math.max(190, Math.min(380, +S.cfg.dockW || 236));
// плюс блоки плагинов, которым есть что показать в доке («p:<id>»); «lamp» прежних настроек — плагин лампы
const dockPlugins = () => S.plugins.list.filter(x => x.running && (x.dock || []).length).map(x => 'p:' + x.id);
const dockOrder = () => { const P = dockPlugins(), ok = x => DOCK_IDS.includes(x) || P.includes(x);
  const o = (S.cfg.dockOrder || []).map(x => x === 'lamp' ? 'p:lamp' : x).filter(ok); return [...new Set([...o, ...DOCK_IDS, ...P])]; };
const DOCK_NAMES = () => ({stats:T('Monitoring', 'Моніторинг'), gap:T('Empty space', 'Порожнє місце'), clock:T('Clock', 'Годинник'),
  media:T('Player', 'Плеєр')});
const plugOf = id => S.plugins.list.find(x => x.id === id);
const dockName = id => id.startsWith('p:') ? ((plugOf(id.slice(2)) || {}).name || id.slice(2)) : DOCK_NAMES()[id];
// высота блоков дока (cfg.dockH: блок → px содержимого): в «Правке» тянут за нижний край, как окно; больше
// места, чем пустого, не дать — «Пустое место» забирает остаток
const dockH = id => { const h = +(S.cfg.dockH || {})[id]; return id !== 'gap' && h > 0 ? Math.round(h) : 0; };
const dockOff = id => ({stats:S.cfg.mon === false, clock:S.cfg.clock !== true, media:S.cfg.spot === false})[id];
function dockBlock(id, i, n){
  const body = {
    stats:`<div id="stats" data-act="diag" role="button" aria-label="${T('PC diagnostics', 'Діагностика ПК')}" style="display:${S.cfg.mon === false ? 'none' : 'flex'};flex-direction:column;gap:10px"></div>`,
    gap:'', clock:'<div id="clock"></div>',
    media:`<div id="media" style="display:${S.cfg.spot === false ? 'none' : dockH('media') ? 'flex' : 'block'}"></div>`}[id]
    ?? (id.startsWith('p:') ? (th => `<div class="pblk ${th.cls}" style="${th.style}" data-pid="${esc(id.slice(2))}">${pwList(id.slice(2), (plugOf(id.slice(2)) || {}).dock)}</div>`)(pTheme(id.slice(2), true)) : '');
  const off = dockOff(id), h = off ? 0 : dockH(id), sz = h ? ` sized" style="--h:${h}px` : '';
  if (!S.edit) return id === 'gap' ? '<div class="dgap"></div>' : `<div class="dblk${sz}" data-blk="${id}"${off ? ' hidden' : ''}>${body}</div>`;
  return `<div class="dblk dedit${id === 'gap' ? ' dgap' : ''}${sz}" data-blk="${id}"><div class="dbar"><span>${esc(dockName(id))}${off ? ` · ${T('off', 'вимк')}` : ''}</span>
    <button data-act="dockMove" data-id="${id}" data-d="-1" aria-label="${T('Up', 'Вище')}"${i ? '' : ' disabled'}>▲</button>
    <button data-act="dockMove" data-id="${id}" data-d="1" aria-label="${T('Down', 'Нижче')}"${i < n - 1 ? '' : ' disabled'}>▼</button></div>${body}
    ${id === 'gap' || off ? '' : `<div class="drz" data-rz="${id}" role="slider" aria-label="${T('Block height: drag the edge, double tap — reset', 'Висота блоку: тягни за край, подвійний тап — як було')}" title="${T('Drag — up / down, double tap — reset', 'Тягни — вище / нижче, подвійний тап — як було')}"><span></span></div>`}</div>`;
}
// всё включено (мониторинг, часы, лампа, плеер с «Микс/Повтор») — док становится плотнее, чтобы влезть
function fitDock(){
  const d = $('#dock'); if (!d) return;
  d.classList.remove('tight');
  if (d.scrollHeight > d.clientHeight + 1) d.classList.add('tight');
  d.classList.toggle('scrl', d.scrollHeight > d.clientHeight + 1);   // и плотно не влезло — листается
  const g = d.querySelector('.dgap');
  if (!S.edit && g) S.dockSpare = g.offsetHeight;          // столько ещё можно отдать блокам в «Правке»
}

// бежит, только если не влезает; скорость — по длине (≈ 40 px/с); то же название — с того же места
function miniRun(el, prev){

function renderPad(){

  const err = Object.values(S.padErrors || {})[0];
  let body;
  if (P.status !== 'ok' || !list.length){
    const txt = P.status === 'install' ? T('Installing sound libraries — once, a minute or two…', 'Встановлюю бібліотеки звуку — це один раз, хвилина-дві…')
      : P.status === 'nolib' ? T('Couldn\'t install the sound libraries (numpy, sounddevice, soundfile). Details — in logs\\server.log on the PC.', 'Не вдалося встановити бібліотеки звуку (numpy, sounddevice, soundfile). Подробиці — у logs\\server.log на ПК.')

        + T(' — buttons appear by themselves.<br>A number at the start of the name («01 …») sets the order and isn\'t shown on the button.', ' — кнопки з’являться самі.<br>Номер на початку назви («01 …») задає порядок і на кнопці не показується.');

    body = `<div class="pad-empty"><div style="color:${PAD_ACC}">${I.noteBig}</div><div style="max-width:600px">${txt}</div>${btns}</div>`;

      </button>`;
    }
    body = `<div id="pgrid">${tiles}</div>`;
  }

    `<button class="pd" data-act="padPage" data-i="${i}" aria-label="${T('Page', 'Сторінка')} ${i+1}" style="width:${i===S.padPage?28:10}px;background:${i===S.padPage?PAD_ACC:'#3A404C'}"></button>`).join('');
  v.innerHTML = `

// не гасить экран, пока деком пользуются: приложение (keepAwake — в новых версиях APK) или Wake Lock в браузере

// ---------- плагины ----------
// С ПК приходит {t:'plugins', on, folder, list:[{id, name, about, on, running, error, dock, settings, tiles}]}.
// Элементы плагина — простые виды: button / toggle / slider / text / row (ряд из них); нажатия уходят на ПК
// {t:'plugin', id, a, v}. Выключен или удалён плагин — его блок в доке, настройки и плитки пропадают.
const PSL = {drag:null, hold:{}, sent:0, trail:null, later:null};
function pluginsIn(m){
  // пока тянут ползунок плагина (или только что отпустили) — не перерисовываем: ПК ещё шлёт старое значение
  const wait = Math.max(0, ...Object.values(PSL.hold)) - Date.now();
  clearTimeout(PSL.later);
  if (PSL.drag || wait > 0){ PSL.later = setTimeout(() => pluginsIn(m), Math.max(60, wait)); return; }
  PSL.hold = {};
  S.plugins = {on:m.on !== false, list:m.list || [], folder:m.folder || ''};
  renderDock(); if (!S.pad && !isHome() && !pmUpdate()) renderView();
  // настройки — только если поменялось то, что в них видно (живые данные плагина — док, экран, режим — идут раз в секунду)
  const sig = JSON.stringify([S.plugins.on, S.plugins.folder,
    S.plugins.list.map(x => Object.fromEntries(Object.entries(x).filter(([k]) => !PLG_LIVE.has(k))))]);
  if (S.settings && !S.vzWheel && !S.rulePick && sig !== S.plgSig) ovRefresh();

}

const icnOf = (n, z = 22) => typeof I[n] === 'function' ? I[n]('currentColor', z) : (I[n] || '');

function pTheme(pid, bgd){
  const t = (plugOf(pid) || {}).theme || {}, v = [];
  const map = {bg:'--p-bg', panel:'--p-panel', border:'--p-border', text:'--p-tx', muted:'--p-mu', accent:'--p-acc'};
  for (const k in map) if (t[k]) v.push(`${map[k]}:${t[k]}`);
  if (t.radius != null) v.push(`--p-r:${t.radius}px`);

// шрифт плагина из его папки — @font-face один раз

// пришли новые данные плагина, а его режим открыт: только содержимое (без шапки и анимаций), прокрутка — на месте.
// true — обновили; false — перерисовать весь вид
// экран режима плагина: плагин шлёт данные часто (Vintage — раз в секунду), перерисовка посреди жеста обрывает прокрутку —
